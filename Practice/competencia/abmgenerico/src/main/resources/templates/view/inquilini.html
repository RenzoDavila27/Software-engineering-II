<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inquilinos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">Alquileres</a>
    <a class="btn btn-outline-light" th:href="@{/inquilinos/nuevo}">Nuevo Inquilino</a>
  </div>
</nav>

<div class="container my-4">
  <h2 class="mb-3">Listado de Inquilinos</h2>

  <div class="table-responsive shadow-sm">
    <table class="table table-striped align-middle">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Documento</th>
          <th>Tipo Doc</th>
          <th>Sexo</th>
          <th>Fecha Nac.</th>
          <th>Teléfono</th>
          <th>Email</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="i, idx : ${inquilinos}">
          <td th:text="${idx.index + 1}">1</td>
          <td th:text="${i.nombre}">Nombre</td>
          <td th:text="${i.apellido}">Apellido</td>
          <td th:text="${i.documento}">12345678</td>
          <td th:text="${i.tipoDocumento}">DNI</td>
          <td th:text="${i.sexo}">MASCULINO</td>
          <td th:text="${i.fechaNacimiento}">1990-01-01</td>
          <td th:text="${i.telefono}">111111</td>
          <td th:text="${i.correoElectronico}">mail@mail.com</td>
          <td>
            <!-- Acción de eliminar lógico -->
            <form th:action="@{|/inquilinos/${i.id}/eliminar|}" method="post" class="d-inline">
              <button class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar?')">Eliminar</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(inquilinos)}">
          <td colspan="10" class="text-center text-muted">No hay inquilinos activos.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
