<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="container my-4">
        <h2 class="mb-4 text-center">Gestión de Categorias</h2>

        <!-- Botones de acción -->
        <div class="mb-8 d-flex justify-content-between">
            <div>
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalCategoria" ><i class="bi bi-plus-circle"></i> Agregar Categoria</button>
            </div>
            <form class="d-flex" th:action="@{/categoria/buscar}" method="get" role="search">
                <input class="form-control me-2" type="search" name="query" placeholder="Buscar por nombre" aria-label="Buscar">
                <button class="btn btn-outline-success" type="submit">Buscar</button>
            </form>
        </div>

        <table class="table table-hover">
            <thead class="thead-light">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Nombre</th>
                </tr>
            </thead>
            <tbody id="tablaClientes">
                  <tr th:each="categoria : ${listaCategoria}"> <!-- RECORRE LA LISTA DE LAS CATEGORIAS-->

                      <td th:text="${categoria.id}"></td>
                      <td th:text="${categoria.nombre}"></td> <!--RELLENA LA INFORMACION-->
                      <td>
                          <button class="btn btn-warning" 
                                  role="button"
                                  data-bs-toggle="modal" 
                                  data-bs-target="#modalEditarCategoria"
                                  th:attr="data-id=${categoria.id}, data-nombre=${categoria.nombre}"
                                  onclick="cargarEditarCategoria(this)">
                              <i class="bi bi-pencil-square" aria-hidden="true"></i>
                          </button>
                          <a th:href="@{/categoria/eliminar/{id}(id=${categoria.id})}"
                             class="btn btn-danger"
                             onclick="return confirm('¿Seguro que deseas eliminar esta categoria?');">
                              <i class="bi bi-trash"></i>
                          </a>
                      </td> <!--SI USO btn-sm al lado de danger se hace mas pequeño-->

                </tr>
                
            </tbody>
        </table>
    </div>
    <!-- Modal Agregar Categoria -->
    <div class="modal fade" id="modalCategoria" tabindex="-1" aria-labelledby="modalCategoriaLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
        
        <div class="modal-header">
            <h5 class="modal-title" id="modalCategoriaLabel">Agregar Categoria</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <div class="modal-body">
            <form th:action="@{/categoria/guardar}" th:object="${categoria}" method="post">

            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" th:field="*{nombre}" class="form-control" required>
            </div>

            <div class="modal-footer">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            </div>
            </form>
        </div>

        </div>
    </div>
    </div>
    <!-- Modal Editar Categoria -->
<div class="modal fade" id="modalEditarCategoria" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Editar Categoria</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <!-- Notá: sin th:object aquí, para que no haya dudas en el binding -->
        <form id="formEditarCategoria" th:action="@{/categoria/editar}" method="post">
          <input type="hidden" name="id" id="editCategoriaId">
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" name="nombre" id="editCategoriaNombre" class="form-control" required>
          </div>

          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
function cargarEditarCategoria(button) {
    const id = button.getAttribute("data-id");
    const nombre = button.getAttribute("data-nombre");

    document.getElementById("editCategoriaId").value = id;
    document.getElementById("editCategoriaNombre").value = nombre;
}
</script>

</body>
</html>
