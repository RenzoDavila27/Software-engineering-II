<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
    body {
        padding-top: 70px; /* Ajustar según altura del navbar */
    }
</style>
    
</head>
<body>
    
    <nav class="navbar navbar-expand-md navbar-dark fixed-top" id="mainNav" style="background-color: #000000;">
        <div class="container">
            <!-- Logo -->
            <a class="navbar-brand" href="#">
                <img th:src="@{/assets/img/file.jpeg}" alt="Logo" style="height:50px; border-radius:8px;" />
            </a>
            <!-- Botón para volver al index -->
            <div class="ms-auto">
                <a th:href="@{/}" class="btn btn-light">Volver al Inicio</a>
            </div>
        </div>
    </nav>
    
    
    <div class="container my-4">
        <h2 class="mb-4 text-center">Gestión de Estudios</h2>

        <!-- Botones de acción -->
        <div class="mb-8 d-flex justify-content-between">
            <div>
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalEstudio" ><i class="bi bi-plus-circle"></i> Agregar Estudio</button>
            </div>
            <form class="d-flex" th:action="@{/estudio/buscar}" method="get" role="search">
                <input class="form-control me-2" type="search" name="query" placeholder="Buscar por nombre" aria-label="Buscar">
                <button class="btn btn-outline-success" type="submit">Buscar</button>
            </form>
        </div>

        <table class="table table-hover">
            <thead class="thead-light">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Nombre</th>
                </tr>
            </thead>
            <tbody id="tablaClientes">
                  <tr th:each="estudio : ${listaEstudio}"> <!-- RECORRE LA LISTA DE LOS ESTUDIOS-->

                      <td th:text="${estudio.id}"></td>
                      <td th:text="${estudio.nombre}"></td> <!--RELLENA LA INFORMACION-->
                      <td>
                          <button class="btn btn-warning" 
                                  role="button"
                                  data-bs-toggle="modal" 
                                  data-bs-target="#modalEditarEstudio"
                                  th:attr="data-id=${estudio.id}, data-nombre=${estudio.nombre}"
                                  onclick="cargarEditarEstudio(this)">
                              <i class="bi bi-pencil-square" aria-hidden="true"></i>
                          </button>
                          <a th:href="@{/estudio/eliminar/{id}(id=${estudio.id})}"
                             class="btn btn-danger"
                             onclick="return confirm('¿Seguro que deseas eliminar este estudio?');">
                              <i class="bi bi-trash"></i>
                          </a>
                      </td> <!--SI USO btn-sm al lado de danger se hace mas pequeño-->

                </tr>
                
            </tbody>
        </table>
    </div>
    <!-- Modal Agregar Estudio -->
    <div class="modal fade" id="modalEstudio" tabindex="-1" aria-labelledby="modalEstudioLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
        
        <div class="modal-header">
            <h5 class="modal-title" id="modalEstudioLabel">Agregar Estudio</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <div class="modal-body">
            <form th:action="@{/estudio/guardar}" th:object="${estudio}" method="post">

            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" th:field="*{Nombre}" class="form-control" required>
            </div>

            <div class="modal-footer">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            </div>
            </form>
        </div>

        </div>
    </div>
    </div>
        <!-- Modal Editar Estudio -->
<div class="modal fade" id="modalEditarEstudio" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Editar Estudio</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <!-- Notá: sin th:object aquí, para que no haya dudas en el binding -->
        <form id="formEditarEstudio" th:action="@{/estudio/editar}" method="post">
          <input type="hidden" name="id" id="editEstudioId">
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" name="nombre" id="editEstudioNombre" class="form-control" required>
          </div>

          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
    
        <script>
function cargarEditarEstudio(button) {
    const id = button.getAttribute("data-id");
    const nombre = button.getAttribute("data-nombre");

    document.getElementById("editEstudioId").value = id;
    document.getElementById("editEstudioNombre").value = nombre;
}
</script>
</body>
</html>
