<!-- src/main/resources/templates/fragments/sidebar.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="sidebar">
  <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">

    <!-- Brand -->
    <a class="sidebar-brand d-flex align-items-center justify-content-center" th:href="@{/}">
      <div class="sidebar-brand-icon rotate-n-15">
        <i class="fas fa-laugh-wink"></i>
      </div>
      <div class="sidebar-brand-text mx-3">Mi Sistema</div>
    </a>

    <hr class="sidebar-divider my-0">

    <!-- Usuario (collapse example) -->
    <li class="nav-item">
      <a class="nav-link collapsed" href="#" data-toggle="collapse" data-target="#collapseUsuario"
         aria-expanded="false" aria-controls="collapseUsuario">
        <i class="fas fa-fw fa-user"></i>
        <span>Usuario</span>
      </a>
      <div id="collapseUsuario" class="collapse" aria-labelledby="headingUsuario" data-parent="#accordionSidebar">
        <div class="bg-white py-2 collapse-inner rounded">
          <a class="collapse-item" th:href="@{/usuario/listar}">ABM Usuarios</a>
          <a class="collapse-item" th:href="@{/usuario/cambiarClave}">Cambiar Clave</a>
        </div>
      </div>
    </li>

    <!-- Dirección -->
    <li class="nav-item">
      <a class="nav-link collapsed" href="#" data-toggle="collapse" data-target="#collapseDireccion"
         aria-expanded="false" aria-controls="collapseDireccion">
        <i class="fas fa-fw fa-map-marker-alt"></i>
        <span>Dirección</span>
      </a>
      <div id="collapseDireccion" class="collapse" aria-labelledby="headingDireccion" data-parent="#accordionSidebar">
        <div class="bg-white py-2 collapse-inner rounded">
          <a class="collapse-item" th:href="@{/pais/listar}">ABM País</a>
          <a class="collapse-item" th:href="@{/provincia/listar}">ABM Provincia</a>
          <a class="collapse-item" th:href="@{/departamento/listar}">ABM Departamento</a>
          <a class="collapse-item" th:href="@{/localidad/listar}">ABM Localidad</a>
        </div>
      </div>
    </li>

    <!-- Empresa -->
    <li class="nav-item">
      <a class="nav-link" th:href="@{/empresa/listar}">
        <i class="fas fa-fw fa-building"></i>
        <span>Empresa</span>
      </a>
    </li>

    <!-- Proveedor -->
    <li class="nav-item">
      <a class="nav-link" th:href="@{/proveedor/listar}">
        <i class="fas fa-fw fa-truck"></i>
        <span>Proveedor</span>
      </a>
    </li>

    <!-- Migración -->
    <li class="nav-item">
      <a class="nav-link" th:href="@{/migracion}">
        <i class="fas fa-fw fa-database"></i>
        <span>Migración</span>
      </a>
    </li>

    <!-- Promocion -->
    <li class="nav-item">
      <a class="nav-link" th:href="@{/promocion/listar}">
        <i class="fas fa-fw fa-bullhorn"></i>
        <span>Promocion</span>
      </a>
    </li>

    <hr class="sidebar-divider d-none d-md-block">

    <!-- Sidebar Toggler -->
    <div class="text-center d-none d-md-inline">
      <button class="rounded-circle border-0" id="sidebarToggle"></button>
    </div>

  </ul>
</div>
</body>
</html>
