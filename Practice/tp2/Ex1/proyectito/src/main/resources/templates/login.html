<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Ingreso</title>

  <link rel="stylesheet" th:href="@{/vendor/fontawesome-free/css/all.min.css}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900&display=swap">
  <link rel="stylesheet" th:href="@{/css/sb-admin-2.min.css}">
</head>
<body class="bg-gradient-primary">

<div class="container">

  <div class="row justify-content-center">

    <div class="col-xl-10 col-lg-12 col-md-9">
      <div class="card o-hidden border-0 shadow-lg my-5">
        <div class="card-body p-0">
          <div class="row">
            <div class="col-lg-6 d-none d-lg-block bg-login-image"></div>
            <div class="col-lg-6">
              <div class="p-5">
                <div class="text-center mb-4">
                  <h1 class="h4 text-gray-900">Bienvenido</h1>
                  <p class="text-muted mb-0">Ingresá con tu cuenta para continuar.</p>
                </div>

                <div th:if="${msgExito != null}" class="alert alert-success" th:text="${msgExito}" role="alert"></div>
                <div th:if="${msgError != null}" class="alert alert-danger" th:text="${msgError}" role="alert"></div>

                <form th:action="@{/usuario/login}" method="post" class="user">
                  <div class="form-group">
                    <input type="text"
                           class="form-control form-control-user"
                           name="cuenta"
                           placeholder="Escribí tu cuenta"
                           required>
                  </div>
                  <div class="form-group">
                    <input type="password"
                           class="form-control form-control-user"
                           name="clave"
                           placeholder="Escribí tu clave"
                           required>
                  </div>
                  <button type="submit" class="btn btn-primary btn-user btn-block">
                    <i class="fas fa-sign-in-alt"></i> Ingresar
                  </button>
                </form>

                <hr>
                <div class="text-center">
                  <a class="small" th:href="@{/usuario/crearForm}">¿Todavía no tenés cuenta? Registrate</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

</div>

<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
<script th:src="@{/js/sb-admin-2.min.js}"></script>

</body>
</html>
