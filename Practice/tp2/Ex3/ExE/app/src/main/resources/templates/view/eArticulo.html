<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title th:text="${titleEdit}">Editar artículo</title>
        <link rel="stylesheet" th:href="@{/css/styles.css}" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.min.css" rel="stylesheet" />
    </head>
    <body>
        <div class="container py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 mb-1" th:text="${titleEdit}">Editar artículo</h1>
                    <p class="text-muted mb-0">Completá los datos del artículo y guardá los cambios.</p>
                </div>
                <a class="btn btn-outline-secondary" th:href="@{'/' + ${nameEntityLower} + '/list'}">
                    <i class="bi-arrow-left me-1"></i>
                    Volver
                </a>
            </div>

            <div th:if="${msgError != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi-exclamation-triangle me-2"></i>
                <span th:text="${msgError}">Se produjo un error.</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>

            <div th:if="${usuarioActual == null and !isDisabled}" class="alert alert-warning" role="alert">
                <i class="bi-exclamation-triangle me-2"></i>
                Debés <a class="alert-link" th:href="@{/login}">iniciar sesión</a> para gestionar artículos.
            </div>

            <form th:if="${usuarioActual != null or isDisabled}" th:action="@{/articulo/actualizar}" th:object="${item}" method="post" class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <input type="hidden" th:field="*{id}" />

                    <div class="d-flex justify-content-end mb-3" th:if="${item != null and item.id != null}">
                        <a class="btn btn-outline-primary" th:href="@{'/articulo/' + ${item.id} + '/imagenes'}">
                            <i class="bi-images me-1"></i>
                            Gestionar imágenes
                        </a>
                    </div>

                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" id="nombre" class="form-control" th:field="*{nombre}" th:disabled="${isDisabled}" placeholder="Ingresá el nombre del artículo" required />
                    </div>

                    <div class="mb-3">
                        <label for="precio" class="form-label">Precio</label>
                        <input type="number" id="precio" class="form-control" th:field="*{precio}" th:disabled="${isDisabled}" placeholder="Ingresá el precio" min="0" step="0.01" required />
                    </div>

                    <div class="mb-3">
                        <label for="proveedor" class="form-label">Proveedor</label>
                        <select id="proveedor" class="form-select" th:field="*{proveedor.id}" th:disabled="${isDisabled}">
                            <option value="" disabled th:selected="${item.proveedor == null or item.proveedor.id == null}">Seleccioná un proveedor</option>
                            <option th:each="proveedor : ${proveedores}" th:value="${proveedor.id}" th:text="${proveedor.nombre}"></option>
                        </select>
                    </div>
                </div>
                <div class="card-footer bg-white d-flex justify-content-between p-3">
                    <a class="btn btn-outline-secondary" th:href="@{'/' + ${nameEntityLower} + '/cancelar'}">
                        <i class="bi-x-circle me-1"></i>
                        Cancelar
                    </a>
                    <div>
                        <a th:if="${isDisabled}" class="btn btn-primary" th:href="@{'/' + ${nameEntityLower} + '/modificar/' + ${item.id}}">
                            <i class="bi-pencil-square me-1"></i>
                            Editar
                        </a>
                        <button th:if="${!isDisabled}" type="submit" class="btn btn-primary">
                            <i class="bi-save me-1"></i>
                            Guardar
                        </button>
                    </div>
                </div>
            </form>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
