<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title th:text="${titleEdit}">Editar proveedor</title>
        <link rel="stylesheet" th:href="@{/css/styles.css}" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.min.css" rel="stylesheet" />
    </head>
    <body>
        <div class="container py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 mb-1" th:text="${titleEdit}">Editar proveedor</h1>
                    <p class="text-muted mb-0">Completá los datos del proveedor y guardá los cambios.</p>
                </div>
                <a class="btn btn-outline-secondary" th:href="@{'/' + ${nameEntityLower} + '/list'}">
                    <i class="bi-arrow-left me-1"></i>
                    Volver
                </a>
            </div>

            <div th:if="${msgError != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi-exclamation-triangle me-2"></i>
                <span th:text="${msgError}">Se produjo un error.</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>

            <div th:if="${!esAdmin and !isDisabled}" class="alert alert-warning" role="alert">
                <i class="bi-exclamation-triangle me-2"></i>
                Debés <a class="alert-link" th:href="@{/login}">iniciar sesión como administrador</a> para gestionar proveedores.
            </div>

            <form th:if="${esAdmin or isDisabled}" th:action="@{/proveedor/actualizar}" th:object="${item}" method="post" class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <input type="hidden" th:field="*{id}" />

                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" id="nombre" class="form-control" th:field="*{nombre}" th:disabled="${isDisabled}" placeholder="Ingresá el nombre del proveedor" required />
                    </div>

                    <label for="direccion">Dirección:</label>
                    <input type="text" id="direccion" class="form-control" th:field="*{direccion}" th:disabled="${isDisabled}" placeholder="Ingresá la dirección del proveedor(calle,ciudad,provincia,pais)" required />
                </div>
                <div class="card-footer bg-white d-flex justify-content-between p-3">
                    <a class="btn btn-outline-secondary" th:href="@{'/' + ${nameEntityLower} + '/cancelar'}">
                        <i class="bi-x-circle me-1"></i>
                        Cancelar
                    </a>
                    <div>
                        <a th:if="${isDisabled}" class="btn btn-primary" th:href="@{'/' + ${nameEntityLower} + '/modificar/' + ${item.id}}">
                            <i class="bi-pencil-square me-1"></i>
                            Editar
                        </a>
                        <button th:if="${!isDisabled}" type="submit" class="btn btn-primary">
                            <i class="bi-save me-1"></i>
                            Guardar
                        </button>
                    </div>
                </div>
            </form>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
