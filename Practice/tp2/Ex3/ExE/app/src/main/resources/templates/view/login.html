<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Iniciar sesión</title>
        <link rel="stylesheet" th:href="@{/css/styles.css}" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.min.css" rel="stylesheet" />
    </head>
    <body class="bg-light">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-sm-10 col-md-6 col-lg-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-4">
                            <div class="text-center mb-4">
                                <h1 class="h3 mb-2">Iniciar sesión</h1>
                                <p class="text-muted mb-0">Accedé para administrar los artículos</p>
                            </div>

                            <div th:if="${msgError != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
                                <i class="bi-exclamation-triangle me-2"></i>
                                <span th:text="${msgError}">Se produjo un error.</span>
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                            </div>

                            <form th:action="@{/login}" method="post" novalidate>
                                <input type="hidden" name="redirect" th:value="${redirect}" />

                                <div class="mb-3">
                                    <label for="nombre" class="form-label">Usuario</label>
                                    <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ingresá tu usuario" th:value="${nombre}" required autofocus />
                                </div>

                                <div class="mb-4">
                                    <label for="password" class="form-label">Contraseña</label>
                                    <input type="password" id="password" name="password" class="form-control" placeholder="Ingresá tu contraseña" required />
                                </div>

                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi-door-open me-1"></i>
                                        Ingresar
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                    <div class="text-center mt-4">
                        <a class="text-decoration-none text-muted" th:href="@{/}">
                            <i class="bi-arrow-left me-1"></i>
                            Volver al inicio
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
