<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titleList}">Estudios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Videojuegos</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/videojuegos}">Videojuegos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/categorias}">Categorías</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/estudios}">Estudios</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3" th:text="${titleList}">Estudios</h1>
        <a class="btn btn-primary" th:href="@{/estudios/nuevo}">Nuevo estudio</a>
    </div>

    <div th:if="${msgExito}" class="alert alert-success" th:text="${msgExito}"></div>
    <div th:if="${msgError}" class="alert alert-danger" th:text="${msgError}"></div>

    <div class="table-responsive">
        <table class="table table-striped">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="estudio : ${items}">
                <td th:text="${estudio.id}">1</td>
                <td th:text="${estudio.nombre}">Nombre</td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/estudios/{id}/ver(id=${estudio.id})}">Ver</a>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/estudios/{id}/editar(id=${estudio.id})}">Editar</a>
                    <a class="btn btn-sm btn-outline-danger" th:href="@{/estudios/{id}/eliminar(id=${estudio.id})}"
                       onclick="return confirm('¿Desea eliminar el estudio seleccionado?');">Eliminar</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(items)}">
                <td colspan="3" class="text-center">No se registraron estudios.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
