<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titleForm}">Videojuego</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Videojuegos</a>
    </div>
</nav>

<main class="container py-4">
    <div class="mb-3">
        <a th:href="@{/videojuegos}" class="btn btn-link">&larr; Volver al listado</a>
    </div>

    <h1 class="h3" th:text="${titleForm}">Videojuego</h1>

    <div th:if="${msgError}" class="alert alert-danger" th:text="${msgError}"></div>

    <form th:action="@{/videojuegos/guardar}" th:object="${form}" method="post" class="row g-3">
        <input type="hidden" th:field="*{id}">

        <div class="col-md-6">
            <label class="form-label">Título</label>
            <input type="text" class="form-control" th:field="*{titulo}" th:disabled="${isDisabled}">
            <div class="text-danger" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Ruta imagen</label>
            <input type="text" class="form-control" th:field="*{rutaimg}" th:disabled="${isDisabled}">
            <div class="text-danger" th:if="${#fields.hasErrors('rutaimg')}" th:errors="*{rutaimg}"></div>
        </div>

        <div class="col-md-3">
            <label class="form-label">Precio</label>
            <input type="number" step="0.01" class="form-control" th:field="*{precio}" th:disabled="${isDisabled}">
            <div class="text-danger" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
        </div>

        <div class="col-md-3">
            <label class="form-label">Cantidad</label>
            <input type="number" class="form-control" th:field="*{cantidad}" th:disabled="${isDisabled}">
            <div class="text-danger" th:if="${#fields.hasErrors('cantidad')}" th:errors="*{cantidad}"></div>
        </div>

        <div class="col-md-3">
            <label class="form-label">Oferta</label>
            <select class="form-select" th:field="*{oferta}" th:disabled="${isDisabled}">
                <option th:value="true">Sí</option>
                <option th:value="false">No</option>
            </select>
        </div>

        <div class="col-md-3">
            <label class="form-label">Fecha de lanzamiento</label>
            <input type="text" class="form-control" th:field="*{fechalanzamiento}" th:disabled="${isDisabled}">
            <div class="text-danger" th:if="${#fields.hasErrors('fechalanzamiento')}" th:errors="*{fechalanzamiento}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Categoría</label>
            <select class="form-select" th:field="*{categoriaId}" th:disabled="${isDisabled}">
                <option th:value="__NULL__" disabled="disabled" th:selected="${form.categoriaId} == null">Seleccione</option>
                <option th:each="categoria : ${categorias}" th:value="${categoria.id}"
                        th:text="${categoria.nombre}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('categoriaId')}" th:errors="*{categoriaId}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Estudio</label>
            <select class="form-select" th:field="*{estudioId}" th:disabled="${isDisabled}">
                <option th:value="__NULL__" disabled="disabled" th:selected="${form.estudioId} == null">Seleccione</option>
                <option th:each="estudio : ${estudios}" th:value="${estudio.id}"
                        th:text="${estudio.nombre}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('estudioId')}" th:errors="*{estudioId}"></div>
        </div>

        <div class="col-12">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" rows="3" th:field="*{descripcion}" th:disabled="${isDisabled}"></textarea>
            <div class="text-danger" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
        </div>

        <div class="col-12" th:if="${!isDisabled}">
            <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
