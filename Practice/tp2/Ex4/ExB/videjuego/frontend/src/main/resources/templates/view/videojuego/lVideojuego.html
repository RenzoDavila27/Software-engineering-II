<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titleList}">Videojuegos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Videojuegos</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" th:href="@{/videojuegos}">Videojuegos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/categorias}">Categorías</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/estudios}">Estudios</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3" th:text="${titleList}">Videojuegos</h1>
        <a class="btn btn-primary" th:href="@{/videojuegos/nuevo}">Nuevo videojuego</a>
    </div>

    <div th:if="${msgExito}" class="alert alert-success" th:text="${msgExito}"></div>
    <div th:if="${msgError}" class="alert alert-danger" th:text="${msgError}"></div>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th>#</th>
                <th>Título</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Categoría</th>
                <th>Estudio</th>
                <th>Oferta</th>
                <th>Fecha lanzamiento</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="videojuego, iterStat : ${items}">
                <td th:text="${iterStat.count}">1</td>
                <td>
                    <div class="fw-semibold" th:text="${videojuego.titulo}">Título</div>
                    <div class="text-muted small" th:text="${videojuego.descripcion}">Descripción</div>
                </td>
                <td th:text="${#numbers.formatDecimal(videojuego.precio, 1, 'POINT', 2, 'POINT')}"></td>
                <td th:text="${videojuego.cantidad}">0</td>
                <td th:text="${videojuego.categoria != null ? videojuego.categoria.nombre : ''}">Categoría</td>
                <td th:text="${videojuego.estudio != null ? videojuego.estudio.nombre : ''}">Estudio</td>
                <td>
                    <span class="badge" th:classappend="${videojuego.oferta} ? ' bg-success' : ' bg-secondary'"
                          th:text="${videojuego.oferta} ? 'Sí' : 'No'"></span>
                </td>
                <td th:text="${videojuego.fechalanzamiento}">Fecha</td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/videojuegos/{id}/ver(id=${videojuego.id})}">Ver</a>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/videojuegos/{id}/editar(id=${videojuego.id})}">Editar</a>
                    <a class="btn btn-sm btn-outline-danger" th:href="@{/videojuegos/{id}/eliminar(id=${videojuego.id})}"
                       onclick="return confirm('¿Desea eliminar el videojuego seleccionado?');">Eliminar</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(items)}">
                <td colspan="9" class="text-center">No se registraron videojuegos.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
