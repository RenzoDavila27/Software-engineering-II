<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
   <head>
      <meta charset="utf-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Nuevo Usuario</title>
      <link rel="stylesheet" href="css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}">
      <link rel="stylesheet" href="css/style.css" th:href="@{/css/style.css}">
      <link rel="stylesheet" href="css/responsive.css" th:href="@{/css/responsive.css}">
      <link rel="icon" href="images/fevicon.png" th:href="@{/images/fevicon.png}" type="image/gif" />
   </head>
   <body class="main-layout about_page">
      <header>
         <div class="header">
            <div class="container">
               <div class="row">
                  <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col logo_section">
                     <div class="full">
                        <div class="center-desk">
                           <div class="logo"><a th:href="@{/}"><img th:src="@{/images/logo.png}" alt="logo"></a></div>
                        </div>
                     </div>
                  </div>
                  <div class="col-xl-9 col-lg-9 col-md-9 col-sm-9">
                     <div class="menu-area">
                        <div class="limit-box">
                           <nav class="main-menu">
                              <ul class="menu-area-main">
                                 <li><a th:href="@{/}">Inicio</a></li>
                                 <li><a th:href="@{/libros}">Libros</a></li>
                                 <li class="active"><a th:href="@{/usuarios}">Usuarios</a></li>
                                 <li><a th:href="@{/autores}">Autores</a></li>
                              </ul>
                           </nav>
                        </div>
                     </div>
                  </div>
               </div>
            </div>
         </div>
      </header>
      <main>
         <div class="container py-5">
            <div class="row justify-content-center">
               <div class="col-lg-8">
                  <div class="card shadow-sm border-0">
                     <div class="card-header bg-white border-0">
                        <h2 class="h4 mb-0">Registrar nuevo usuario</h2>
                     </div>
                     <div class="card-body">
                        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
                        <form th:action="@{/usuarios}" method="post" th:object="${personaForm}" class="row g-3">
                           <div class="col-md-6">
                              <label class="form-label">Nombre</label>
                              <input type="text" class="form-control" th:field="*{nombre}" placeholder="Nombre del socio" required>
                           </div>
                           <div class="col-md-6">
                              <label class="form-label">Apellido</label>
                              <input type="text" class="form-control" th:field="*{apellido}" placeholder="Apellido del socio" required>
                           </div>
                           <div class="col-md-6">
                              <label class="form-label">DNI</label>
                              <input type="number" min="0" class="form-control" th:field="*{dni}" placeholder="Documento">
                           </div>
                           <div class="col-md-6">
                              <label class="form-label">Calle</label>
                              <input type="text" class="form-control" th:field="*{calle}" placeholder="Calle">
                           </div>
                           <div class="col-md-3">
                              <label class="form-label">Número</label>
                              <input type="number" min="0" class="form-control" th:field="*{numero}" placeholder="Número">
                           </div>
                           <div class="col-md-5">
                              <label class="form-label">Localidad</label>
                              <select class="form-select" th:field="*{localidadId}">
                                 <option value="">Seleccionar localidad</option>
                                 <option th:each="loc : ${localidades}"
                                         th:value="${loc.id}"
                                         th:text="${loc.denominacion}"></option>
                              </select>
                           </div>
                           <div class="col-12 d-flex justify-content-end gap-2">
                              <a class="btn btn-outline-secondary" th:href="@{/usuarios}">Cancelar</a>
                              <button type="submit" class="btn btn-primary">Crear usuario</button>
                           </div>
                        </form>
                     </div>
                  </div>
               </div>
            </div>
         </div>
      </main>
      <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
   </body>
</html>
