<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<title>Login - Consultorio Médico</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" th:href="@{/assets/css/main.css}" />
		<noscript><link rel="stylesheet" th:href="@{/assets/css/noscript.css}" /></noscript>
	</head>
	<body class="is-preload">

		<!-- Wrapper-->
			<div id="wrapper">

				<!-- Main -->
					<div id="main">

						<!-- Login -->
							<article id="login" class="panel intro">
								<header>
									<h1>Consultorio Médico</h1>
									<p>Sistema de Gestión de Historias Clínicas</p>
								</header>
								<div th:if="${error}" class="alert alert-danger" style="color: red; margin-bottom: 1em;">
									<p th:text="${error}"></p>
								</div>
								<div th:if="${mensaje}" class="alert alert-success" style="color: green; margin-bottom: 1em;">
									<p th:text="${mensaje}"></p>
								</div>
								<form th:action="@{/login}" method="post">
									<div>
										<div class="row">
											<div class="col-12">
												<input type="text" name="username" placeholder="Usuario" required />
											</div>
											<div class="col-12">
												<input type="password" name="password" placeholder="Contraseña" required />
											</div>
											<div class="col-12">
												<input type="submit" value="Iniciar Sesión" />
											</div>
										</div>
									</div>
								</form>
							</article>

					</div>

				<!-- Footer -->
					<div id="footer">
						<ul class="copyright">
							<li>&copy; Consultorio Médico 2025.</li><li>Design: <a href="http://html5up.net">HTML5 UP</a></li>
						</ul>
					</div>

			</div>

		<!-- Scripts -->
			<script th:src="@{/assets/js/jquery.min.js}"></script>
			<script th:src="@{/assets/js/browser.min.js}"></script>
			<script th:src="@{/assets/js/breakpoints.min.js}"></script>
			<script th:src="@{/assets/js/util.js}"></script>
			<script th:src="@{/assets/js/main.js}"></script>

	</body>
</html>
