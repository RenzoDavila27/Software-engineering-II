<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<title>Paciente - Consultorio Médico</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" th:href="@{/assets/css/main.css}" />
		<noscript><link rel="stylesheet" th:href="@{/assets/css/noscript.css}" /></noscript>
	</head>
	<body class="is-preload">

		<!-- Wrapper-->
			<div id="wrapper">

				<!-- Nav -->
					<nav id="nav">
						<a href="#" class="icon solid fa-home"><span>Inicio</span></a>
						<a href="#historia" class="icon solid fa-notes-medical"><span>Historia Clínica</span></a>
						<a href="#perfil" class="icon solid fa-user"><span>Mi Perfil</span></a>
					</nav>

				<!-- Main -->
					<div id="main">

						<!-- Home -->
							<article id="home" class="panel intro">
								<header>
									<h1 th:text="'Bienvenido ' + ${usuario.nombreUsuario}">Bienvenido</h1>
									<p>Sistema de Gestión de Historias Clínicas</p>
								</header>
								<div th:if="${exito}" class="alert alert-success" style="color: green; margin-bottom: 1em;">
									<p th:text="${exito}"></p>
								</div>
								<div th:if="${error}" class="alert alert-danger" style="color: red; margin-bottom: 1em;">
									<p th:text="${error}"></p>
								</div>
								<a href="#historia" class="jumplink pic">
									<span class="arrow icon solid fa-chevron-right"><span>Ver historia clínica</span></span>
									<img th:src="@{fotoPaciente.contenido}" alt="" />
								</a>
							</article>

						<!-- Historia Clínica -->
							<article id="historia" class="panel">
								<header>
									<h2>Historia Clínica</h2>
								</header>

							</article>

						<!-- Mi Perfil -->
							<article id="perfil" class="panel">
								<header>
									<h2>Mi Perfil</h2>
								</header>
								<form th:action="@{/paciente/perfil/actualizar}" method="post">
									<div>
										<div class="row">
											<div class="col-6 col-12-medium">
												<input type="text" name="nombre" placeholder="Nombre" th:value="${usuario.nombreUsuario}" />
											</div>
											<div class="col-6 col-12-medium">
												<input type="text" name="apellido" placeholder="Apellido" value="" />
											</div>
											<div class="col-12">
												<input type="text" name="documento" placeholder="Documento" value="" />
											</div>
											<div class="col-12">
												<input type="text" name="usuario" placeholder="Usuario" th:value="${usuario.nombreUsuario}" readonly />
											</div>
											<div class="col-12">
												<input type="password" name="password" placeholder="Nueva Contraseña (dejar en blanco para no cambiar)" />
											</div>
											<div class="col-12">
												<input type="password" name="confirmPassword" placeholder="Confirmar Contraseña" />
											</div>
											<div class="col-12">
												<input type="submit" value="Guardar Cambios" />
											</div>
										</div>
									</div>
								</form>
								<div style="margin-top: 1em;">
									<a th:href="@{/logout}" class="button">Cerrar Sesión</a>
								</div>
							</article>

					</div>

				<!-- Footer -->
					<div id="footer">
						<ul class="copyright">
							<li>&copy; Untitled.</li><li>Design: <a href="http://html5up.net">HTML5 UP</a></li>
						</ul>
					</div>

			</div>

		<!-- Scripts -->
			<script th:src="@{/assets/js/jquery.min.js}"></script>
			<script th:src="@{/assets/js/browser.min.js}"></script>
			<script th:src="@{/assets/js/breakpoints.min.js}"></script>
			<script th:src="@{/assets/js/util.js}"></script>
			<script th:src="@{/assets/js/main.js}"></script>

	</body>
</html>
