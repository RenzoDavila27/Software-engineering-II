<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titleEdit}">Edición de Cliente</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            color: #333;
        }
        .container {
            margin-top: 2rem;
            max-width: 600px;
        }
        h1 {
            color: #ffbc00;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        label {
            font-weight: bold;
        }
        input.form-control[disabled] {
            background-color: #e9ecef;
        }
        .btn-primary {
            background-color: #ffbc00;
            border-color: #ffbc00;
        }
        .btn-primary:hover {
            background-color: #e6ac00;
            border-color: #e6ac00;
        }
        .btn-secondary {
            margin-left: 0.5rem;
        }
        .error-msg {
            color: red;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <h1 th:text="${titleEdit}">Edición de Cliente</h1>

    <form th:action="@{/cliente/actualizar}" th:object="${item}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label>Nombre:</label>
            <input type="text" class="form-control" th:field="*{nombre}" th:disabled="${isDisabled}" />
        </div>
        <div class="mb-3">
            <label>Apellido:</label>
            <input type="text" class="form-control" th:field="*{apellido}" th:disabled="${isDisabled}" />
        </div>
        <div class="mb-3">
            <label>Documento:</label>
            <input type="text" class="form-control" th:field="*{documento}" th:disabled="${isDisabled}" />
        </div>

        <div class="d-flex justify-content-center">
            <button type="submit" class="btn btn-primary" th:if="!${isDisabled}"><i class="fas fa-save"></i> Guardar</button>
            <a class="btn btn-secondary" th:href="@{/cliente/cancelar}"><i class="fas fa-times"></i> Cancelar</a>
        </div>

        <div th:if="${msgError}" class="error-msg" th:text="${msgError}"></div>
    </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
