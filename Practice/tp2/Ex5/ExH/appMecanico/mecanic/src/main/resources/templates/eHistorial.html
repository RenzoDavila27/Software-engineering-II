<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edición de Arreglo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; color: #333; }
        .form-container {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            margin-top: 2rem;
            max-width: 700px;
        }
        label { font-weight: 600; }
        .btn-primary { background-color: #ffbc00; border-color: #ffbc00; }
        .btn-primary:hover { background-color: #e6ac00; border-color: #e6ac00; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container d-flex justify-content-center">
    <div class="form-container">
        <h2 class="mb-4 text-center">Edición de Arreglo</h2>

        <div th:if="${msgError}" class="alert alert-danger" th:text="${msgError}"></div>

        <form th:action="@{/historial/actualizar}" th:object="${item}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label>Vehículo (patente)</label>
                <input type="text" class="form-control" th:value="${vehiculo}" disabled />
            </div>

            <div class="mb-3">
                <label>Mecánico</label>
                <input type="text" class="form-control" th:value="${mecanico}" disabled />
            </div>

            <div class="mb-3">
                <label>Fecha de Arreglo</label>
                <input type="date" class="form-control" th:field="*{fechaArreglo}" th:disabled="${isDisabled}" />
            </div>

            <div class="mb-3">
                <label>Detalle de Arreglo</label>
                <textarea class="form-control" th:field="*{detalleArreglo}" th:disabled="${isDisabled}"></textarea>
            </div>

            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-primary" th:if="!${isDisabled}">Guardar</button>
                 <a th:if="${item.vehiculo != null}"
                th:href="@{/historial/list/{id}(id=${item.vehiculo.id})}"
                class="btn btn-secondary">
                Cancelar
                </a>

                <a th:if="${item.vehiculo == null}"
                th:href="@{/vehiculo/list}" 
                class="btn btn-secondary">
                Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
