<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Alta de Mecánico</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .navbar-brand { color: #ffbc00 !important; }
    .form-container {
      background: #fff;
      border-radius: 1rem;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      padding: 2rem;
      margin-top: 2rem;
      max-width: 700px;
    }
    label { font-weight: 600; }
    .btn-primary {
      background-color: #ffbc00;
      border-color: #ffbc00;
    }
    .btn-primary:hover {
      background-color: #e6ac00;
      border-color: #e6ac00;
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand text-warning" href="#">FioriTech</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
            data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
            aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" th:href="@{/inicio}">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/cliente/list}">Clientes</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/vehiculo/list}">Vehículos</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/mecanico/list}">Personal</a></li>
        <li class="nav-item"><a class="nav-link" href="/logout">Cerrar sesión</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- FORMULARIO -->
<div class="container d-flex justify-content-center">
  <div class="form-container">
    <h2 class="text-center mb-4" th:text="${title}">Alta de Mecánico</h2>

    <!-- Mensaje de error -->
    <div th:if="${msgError}" class="alert alert-danger" th:text="${msgError}"></div>

    <form th:action="@{/mecanico/actualizar}" th:object="${item}" method="post">

      <!-- Campos del mecánico -->
      <div class="mb-3">
        <label>Nombre:</label>
        <input type="text" class="form-control" th:field="*{nombre}"  >
      </div>

      <div class="mb-3">
        <label>Apellido:</label>
        <input type="text" class="form-control" th:field="*{apellido}"  >
      </div>

      <div class="mb-3">
        <label>Legajo:</label>
        <input type="text" class="form-control" th:field="*{legajo}" >
      </div>

      <hr class="my-4">

      <!-- Campos del usuario asociado -->
      <h5 class="text-secondary mb-3"><i class="fa fa-user"></i> Datos de acceso</h5>

      <div class="mb-3">
        <label>Nombre de Usuario:</label>
        <input type="text" class="form-control" name="nombre">
      </div>

      <div class="mb-3">
        <label>Clave:</label>
        <input type="password" class="form-control" name="clave">
      </div>

      <div class="mb-3">
        <label>Repetir Clave:</label>
        <input type="password" class="form-control" name="repetirClave">
      </div>

      <input type="hidden" th:field="*{usuario.rol}" value="MECANICO">

      <div class="d-flex justify-content-between mt-4">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/mecanico/list}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
