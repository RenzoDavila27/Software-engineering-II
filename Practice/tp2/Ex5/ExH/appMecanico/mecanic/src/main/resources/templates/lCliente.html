<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titleList}">Listado de Clientes</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            color: #333;
        }
        .navbar-brand {
            font-weight: bold;
        }
        .container {
            margin-top: 2rem;
        }
        h1 {
            margin-bottom: 2rem;
            color: #ffbc00;
        }
        table {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        th {
            background-color: #343a40;
            color: #fff;
        }
        td, th {
            padding: 0.75rem;
            text-align: center;
        }
        a.btn {
            margin-right: 0.5rem;
        }
        .btn-primary {
            background-color: #ffbc00;
            border-color: #ffbc00;
        }
        .btn-primary:hover {
            background-color: #e6ac00;
            border-color: #e6ac00;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 th:text="${titleList}">Listado de Clientes</h1>
        <a class="btn btn-primary" th:href="@{/cliente/alta}"><i class="fas fa-plus"></i> Crear Cliente</a>
    </div>

    <table class="table table-hover">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Documento</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${items}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.nombre}"></td>
                <td th:text="${c.apellido}"></td>
                <td th:text="${c.documento}"></td>
                <td>
                    <a class="btn btn-sm btn-warning" th:href="@{/cliente/modificar/{id}(id=${c.id})}"><i class="fas fa-edit"></i> Editar</a>
                    <a class="btn btn-sm btn-danger" th:href="@{/cliente/baja/{id}(id=${c.id})}"><i class="fas fa-trash-alt"></i> Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
