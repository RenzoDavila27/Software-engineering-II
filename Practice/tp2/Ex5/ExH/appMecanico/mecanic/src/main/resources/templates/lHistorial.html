<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Arreglos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; color: #333; }
        .navbar-brand { font-weight: bold; }
        .container { margin-top: 2rem; }
        h1 { margin-bottom: 2rem; color: #ffbc00; }
        table { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th { background-color: #343a40; color: #fff; }
        td, th { padding: 0.75rem; text-align: center; }
        a.btn { margin-right: 0.5rem; }
        .btn-primary { background-color: #ffbc00; border-color: #ffbc00; }
        .btn-primary:hover { background-color: #e6ac00; border-color: #e6ac00; }
        .btn-warning, .btn-danger { color: #fff; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="mb-0">Historial de Arreglos</h1>
            <p class="text-secondary mb-0" th:text="${vehiculoDescripcion}">Vehículo</p>
        </div>
        <div>
            <a class="btn btn-secondary me-2" th:href="@{/vehiculo/list}"><i class="fas fa-arrow-left"></i> Volver</a>
            <a class="btn btn-primary" th:href="@{/historial/alta(idVehiculo=${idVehiculo})}"><i class="fas fa-plus"></i> Nuevo Arreglo</a>
        </div>
    </div>

    <div th:if="${msgError}" class="alert alert-danger" th:text="${msgError}"></div>
    <div th:if="${msgExito}" class="alert alert-success" th:text="${msgExito}"></div>

    <table class="table table-hover" th:if="${items != null and !items.isEmpty()}">
        <thead>
            <tr>
                <th>Auto</th>
                <th>Mecanico</th>
                <th>Fecha de Arreglo</th>
                <th>Detalle de Arreglo</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="h : ${items}">
                <td th:text="${h.vehiculo?.patente}"></td>
                <td th:text="${h.mecanico?.nombre +' '+ h.mecanico?.apellido}"></td>
                <td th:text="${h.fechaArreglo}"></td>
                <td th:text="${h.detalleArreglo}"></td>
                <td>
                    <a class="btn btn-sm btn-info text-white" th:href="@{/historial/consultar/{id}(id=${h.id})}"><i class="fas fa-eye"></i> Ver</a>
                    <a class="btn btn-sm btn-warning" th:href="@{/historial/modificar/{id}(id=${h.id})}"><i class="fas fa-edit"></i> Editar</a>
                    <a class="btn btn-sm btn-danger" th:href="@{/historial/baja/{id}(id=${h.id})}"><i class="fas fa-trash-alt"></i> Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
    <div th:if="${items == null || items.isEmpty()}" class="alert alert-info">
        No hay arreglos registrados para este vehículo todavía.
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
