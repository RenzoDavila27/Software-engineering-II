<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.com/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titleList}">Listado de Vehículos</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            color: #333;
        }
        .navbar-brand {
            font-weight: bold;
        }
        .container {
            margin-top: 2rem;
        }
        h1 {
            margin-bottom: 2rem;
            color: #ffbc00;
        }
        table {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        th {
            background-color: #343a40;
            color: #fff;
        }
        td, th {
            padding: 0.75rem;
            text-align: center;
        }
        a.btn {
            margin-right: 0.5rem;
        }
        .btn-primary {
            background-color: #ffbc00;
            border-color: #ffbc00;
        }
        .btn-primary:hover {
            background-color: #e6ac00;
            border-color: #e6ac00;
        }
        .btn-warning {
            color: #fff;
        }
        .btn-danger {
            color: #fff;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 th:text="${titleList}">Listado de Vehículos</h1>
        <a class="btn btn-primary" th:href="@{/vehiculo/alta}"><i class="fas fa-plus"></i>Añadir vehiculo</a>
    </div>
    <div class="mb-3">
        <input type="text" id="buscarDocumento" class="form-control" placeholder="Buscar por documento del cliente...">
    </div>

    <table class="table table-hover" id = tablaVehiculos>
        <thead>
            <tr>
                <th>ID</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Patente</th>
                <th>Dueño</th>
                <th>Documento</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="v : ${items}">
                <td th:text="${v.id}"></td>
                <td th:text="${v.marca}"></td>
                <td th:text="${v.modelo}"></td>
                <td th:text="${v.patente}"></td>
                <td th:text="${v.cliente.nombre + ' ' + v.cliente.apellido}"></td>
                <td th:text="${v.cliente.documento}"></td>
                <td>
                    <a class="btn btn-sm btn-warning" th:href="@{/vehiculo/modificar/{id}(id=${v.id})}"><i class="fas fa-edit"></i> Editar</a>
                    <a class="btn btn-sm btn-danger" th:href="@{/vehiculo/baja/{id}(id=${v.id})}"><i class="fas fa-trash-alt"></i> Eliminar</a>
                    <a class="btn btn-sm btn-success" th:href="@{/historial/list/{id}(id=${v.id})}"><i class="bi bi-filter"></i> Ver Arreglo</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Filtrar tabla por documento
    const input = document.getElementById("buscarDocumento");
    const tabla = document.getElementById("tablaVehiculos");
    const filas = tabla.getElementsByTagName("tr");

    input.addEventListener("keyup", function() {
        const filtro = input.value.toLowerCase();
        for (let i = 1; i < filas.length; i++) { // i=1 para saltar el encabezado
            const celdas = filas[i].getElementsByTagName("td");
            const documento = celdas[5].textContent.toLowerCase();
            if (documento.includes(filtro)) {
                filas[i].style.display = "";
            } else {
                filas[i].style.display = "none";
            }
        }
    });
</script>
</body>
</html>
