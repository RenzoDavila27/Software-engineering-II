<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mecánica FioriTech - Ingreso</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: url('/img/garage.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
        }
        .login-box {
            background: rgba(0,0,0,0.8);
            border-radius: 20px;
            padding: 40px;
            margin-top: 10%;
            max-width: 400px;
        }
        h2 {
            color: #FFD700;
        }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center">
    <div class="login-box text-center">
        <h2>FioriTech 🚗</h2>
        <form th:action="@{/logincheck}" method="post">
            <input class="form-control mb-3" type="text" name="nombre" placeholder="Nombre" required>
            <input class="form-control mb-3" type="password" name="password" placeholder="Contraseña" required>
            <button class="btn btn-warning w-100" type="submit">Iniciar sesión</button>
        </form>
    </div>
</div>
</body>
</html>
