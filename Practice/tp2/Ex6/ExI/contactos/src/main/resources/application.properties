spring.application.name=contactos
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/contactosdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=ale
spring.datasource.password=tupassword

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.generate-ddl=true
spring.jpa.defer-datasource-initialization=false

spring.h2.console.enabled=false
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
