<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de empresa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h4 text-primary mb-1" th:text="${empresa.nombre}">Nombre empresa</h1>
            <p class="text-muted mb-0">
                Responsable:
                <span th:text="${empresa.persona != null ? empresa.persona.nombre + ' ' + empresa.persona.apellido : 'Sin asignar'}">
                    Responsable
                </span>
            </p>
        </div>
        <div class="d-flex gap-2" th:if="${esAdmin}">
            <a class="btn btn-outline-secondary btn-sm" th:href="@{|/empresas/${empresa.id}/editar|}">Editar</a>
            <form th:action="@{|/empresas/${empresa.id}/eliminar|}" method="post"
                  onsubmit="return confirm('¿Confirmás eliminar la empresa?');">
                <button type="submit" class="btn btn-outline-danger btn-sm">Eliminar</button>
            </form>
        </div>
    </div>

    <section class="card border-0 mb-4">
        <div class="card-body">
            <h2 class="h5 text-primary">Contacto laboral</h2>
            <div th:if="${empresa.contacto == null}" class="alert alert-warning mb-0">
                La empresa todavía no tiene un contacto asociado.
            </div>
            <div th:if="${empresa.contacto != null}">
                <p th:if="${empresa.contacto instanceof T(com.contactos.business.domain.ContactoCorreoElectronico)}"
                   class="mb-2">
                    Correo electrónico:
                    <span class="fw-semibold"
                          th:text="${#casts.cast(empresa.contacto, T(com.contactos.business.domain.ContactoCorreoElectronico)).email}">
                        contacto@empresa.com
                    </span>
                </p>
                <div th:if="${empresa.contacto instanceof T(com.contactos.business.domain.ContactoTelefonico)}" class="mb-2">
                    <p class="mb-0">
                        Teléfono:
                        <span class="fw-semibold"
                              th:text="${#casts.cast(empresa.contacto, T(com.contactos.business.domain.ContactoTelefonico)).telefono}">
                            000
                        </span>
                    </p>
                    <p class="text-muted">
                        Tipo:
                        <span th:text="${#casts.cast(empresa.contacto, T(com.contactos.business.domain.ContactoTelefonico)).tipoTelefono}">
                            CELULAR
                        </span>
                    </p>
                </div>
                <p th:if="${empresa.contacto.observacion != null}" class="text-muted mb-0">
                    Observaciones:
                    <span th:text="${empresa.contacto.observacion}">Observación</span>
                </p>
            </div>
        </div>
    </section>

    <a class="btn btn-outline-primary" th:href="@{/empresas}">Volver al listado</a>
</main>
</body>
</html>
