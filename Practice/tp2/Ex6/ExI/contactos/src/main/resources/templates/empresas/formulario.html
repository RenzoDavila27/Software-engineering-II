<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${esEdicion} ? 'Editar empresa' : 'Nueva empresa'">Empresa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 text-primary mb-0" th:text="${esEdicion} ? 'Editar empresa' : 'Nueva empresa'">Empresa</h1>
        <a class="btn btn-outline-primary btn-sm" th:href="@{/empresas}">Volver</a>
    </div>

    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

    <form th:object="${empresaForm}"
          th:action="${esEdicion} ? @{|/empresas/${empresaForm.id}/actualizar|} : @{/empresas}"
          method="post" class="card border-0 shadow-sm">
        <div class="card-body">
            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{contactoId}">

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" id="nombre" class="form-control" th:field="*{nombre}" required>
            </div>

            <div class="mb-3">
                <label for="personaId" class="form-label">Persona asociada</label>
                <select id="personaId" class="form-select" th:field="*{personaId}" required>
                    <option value="" hidden>Seleccione una persona</option>
                    <option th:each="persona : ${personas}"
                            th:value="${persona.id}"
                            th:text="${persona.nombre + ' ' + persona.apellido}">
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <span class="form-label d-block">Tipo de contacto</span>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" id="tipoCorreo" value="CORREO"
                           th:field="*{tipoContacto}">
                    <label class="form-check-label" for="tipoCorreo">Correo electrónico</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" id="tipoTelefono" value="TELEFONO"
                           th:field="*{tipoContacto}">
                    <label class="form-check-label" for="tipoTelefono">Teléfono</label>
                </div>
            </div>

            <div id="correoGroup" class="mb-3">
                <label for="correo" class="form-label">Correo laboral</label>
                <input type="email" id="correo" class="form-control" th:field="*{correo}">
            </div>

            <div id="telefonoGroup" class="row g-3">
                <div class="col-md-8">
                    <label for="telefono" class="form-label">Teléfono</label>
                    <input type="text" id="telefono" class="form-control" th:field="*{telefono}">
                </div>
                <div class="col-md-4">
                    <label for="tipoTelefono" class="form-label">Tipo</label>
                    <select id="tipoTelefono" class="form-select" th:field="*{tipoTelefono}">
                        <option value="" hidden>Seleccione</option>
                        <option th:each="tipo : ${tiposTelefono}"
                                th:value="${tipo}" th:text="${tipo}"></option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label for="observacion" class="form-label">Observaciones</label>
                <textarea id="observacion" class="form-control" rows="3" th:field="*{observacion}"></textarea>
            </div>
        </div>
        <div class="card-footer bg-white border-0 d-flex justify-content-end gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/empresas}">Cancelar</a>
            <button type="submit" class="btn btn-primary">
                <span th:text="${esEdicion} ? 'Actualizar' : 'Crear'">Guardar</span>
            </button>
        </div>
    </form>
</main>

<script>
    (() => {
        const correoGroup = document.getElementById('correoGroup');
        const telefonoGroup = document.getElementById('telefonoGroup');
        const radios = document.querySelectorAll('input[name="tipoContacto"]');

        const toggleGroups = () => {
            const seleccionado = document.querySelector('input[name="tipoContacto"]:checked');
            if (!seleccionado || seleccionado.value === 'CORREO') {
                correoGroup.classList.remove('d-none');
                telefonoGroup.classList.add('d-none');
            } else {
                correoGroup.classList.add('d-none');
                telefonoGroup.classList.remove('d-none');
            }
        };

        radios.forEach(radio => radio.addEventListener('change', toggleGroups));
        toggleGroups();
    })();
</script>
</body>
</html>
