<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h1 class="h4 text-center mb-4 text-primary">Acceso al sistema</h1>

                    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
                    <div th:if="${logout}" class="alert alert-success" role="alert">
                        Sesión cerrada correctamente.
                    </div>

                    <form th:action="@{/logincheck}" method="post">
                        <div class="mb-3">
                            <label for="cuenta" class="form-label">Usuario</label>
                            <input type="text" class="form-control" id="cuenta" name="cuenta" autofocus required>
                        </div>
                        <div class="mb-4">
                            <label for="clave" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="clave" name="clave" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                    </form>

                    <p class="text-center text-muted small mt-4 mb-0">
                        Ingrese con su usuario asignado. Si es la primera vez, utilice la cuenta de administrador por defecto.
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
