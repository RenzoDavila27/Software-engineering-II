<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container py-4">
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
    <div th:if="${exito}" class="alert alert-success" role="alert" th:text="${exito}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 text-primary mb-0">Personas activas</h1>
        <a class="btn btn-success btn-sm" th:if="${esAdmin}" th:href="@{/personas/nueva}">Nueva persona</a>
    </div>

    <p class="text-muted">Seleccione una persona para conocer sus datos y contactos.</p>

    <div th:if="${#lists.isEmpty(personas)}" class="alert alert-warning" role="alert">
        Aún no hay personas registradas.
    </div>

    <div th:if="${!#lists.isEmpty(personas)}" class="list-group shadow-sm">
        <div th:each="persona : ${personas}"
             class="list-group-item d-flex justify-content-between align-items-center flex-wrap">
            <a class="fw-semibold text-decoration-none text-primary"
               th:href="@{|/personas/${persona.id}|}"
               th:text="${persona.apellido + ', ' + persona.nombre}">
                Persona
            </a>

            <div class="d-flex gap-2 mt-2 mt-sm-0" th:if="${esAdmin}">
                <a class="btn btn-outline-primary btn-sm" th:href="@{|/personas/${persona.id}|}">Ver</a>
                <a class="btn btn-outline-secondary btn-sm" th:href="@{|/personas/${persona.id}/editar|}">Editar</a>
                <form th:action="@{|/personas/${persona.id}/eliminar|}" method="post"
                      onsubmit="return confirm('¿Confirmás eliminar la persona?');">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Eliminar</button>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
