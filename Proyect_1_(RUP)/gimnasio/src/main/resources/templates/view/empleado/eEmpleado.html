<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
 <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="icon" href="favicon.ico">

    <title>EMPLEADO</title>
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/bootstrap/css/jumbotron.css}" rel="stylesheet">
    <link th:href="@{/bootstrap/css/sticky-footer-navbar.css}" rel="stylesheet">
  </head>

  <body>

    <header th:insert="~{fragments/menubody :: menu-principal}"></header>

    <main role="main">
      <hr>
      <div class="container">

        <div class="card">
          <h4 class="card-header"><strong>EDIT EMPLEADO</strong></h4>
          <div class="card-body">

            <form th:action="@{/empleado/aceptarEditEmpleado}" method="post" th:object="${empleado}">

              <div th:if="${msgExito != null}" class='alert alert-success' th:text="${msgExito}" role='alert'></div>
              <div th:if="${msgError != null}" class='alert alert-danger' th:text="${msgError}" role='alert'></div>

              <div class="row">
                <div class="col-md-6">
                  <div class="form-group">

                    <input type="hidden" name="id" th:field="*{id}">

                    <div class="mb-3">
                      <label for="nombre" class="form-label">Nombre</label>
                      <input type="text" class="form-control" th:field="*{nombre}" placeholder="Escriba el nombre" required th:disabled="${isDisabled}">
                    </div>

                    <div class="mb-3">
                      <label for="apellido" class="form-label">Apellido</label>
                      <input type="text" class="form-control" th:field="*{apellido}" placeholder="Escriba el apellido" required th:disabled="${isDisabled}">
                    </div>

                    <div class="mb-3">
                      <label for="fechaNacimiento" class="form-label">Fecha de Nacimiento</label>
                      <input type="date" class="form-control" th:field="*{fechaNacimiento}" required th:disabled="${isDisabled}">
                    </div>

                    <div class="mb-3">
                      <label for="tipoDocumento" class="form-label d-block">Tipo de Documento</label>
                      <select class="form-select" th:field="*{tipoDocumento}" th:disabled="${isDisabled}" required>
                        <option value="" disabled th:selected="*{tipoDocumento} == null">Seleccione</option>
                        <option th:each="tipo : ${tiposDocumento}"
                                th:value="${tipo}"
                                th:text="${#strings.capitalize(tipo.name().toLowerCase())}"></option>
                      </select>
                    </div>

                    <div class="mb-3">
                      <label for="numeroDocumento" class="form-label">Número de Documento</label>
                      <input type="text" class="form-control" th:field="*{numeroDocumento}" placeholder="Escriba el documento" required th:disabled="${isDisabled}">
                    </div>

                    <div class="mb-3">
                      <label for="telefono" class="form-label">Teléfono</label>
                      <input type="text" class="form-control" th:field="*{telefono}" placeholder="Escriba el teléfono" required th:disabled="${isDisabled}">
                    </div>

                    <div class="mb-3">
                      <label for="correoElectronico" class="form-label">Correo Electrónico</label>
                      <input type="email" class="form-control" th:field="*{correoElectronico}" placeholder="Escriba el correo" required th:disabled="${isDisabled}">
                    </div>

                    <div class="mb-3">
                      <label for="tipoEmpleado" class="form-label d-block">Tipo de Empleado</label>
                      <select class="form-select" th:field="*{tipoEmpleado}" th:disabled="${isDisabled}" required>
                        <option value="" disabled th:selected="*{tipoEmpleado} == null">Seleccione</option>
                        <option th:each="tipo : ${tiposEmpleado}"
                                th:value="${tipo}"
                                th:text="${#strings.capitalize(tipo.name().toLowerCase())}"></option>
                      </select>
                    </div>

                    <div class="mb-3">
                      <label for="sucursal" class="form-label d-block">Sucursal</label>
                      <select class="form-select" th:field="*{sucursal.id}" th:disabled="${isDisabled}" required>
                        <option value="" disabled th:selected="*{sucursal} == null">Seleccione</option>
                        <option th:each="suc : ${sucursales}" th:value="${suc.id}" th:text="${suc.nombre}"></option>
                      </select>
                    </div>

                  </div>
                </div>
              </div>

              <hr>
              <div class="d-grid gap-2 float-right justify-content-md-end">
               <button type="submit" title="Guardar el registro." class="btn btn-primary" th:disabled="${isDisabled}">ACEPTAR</button>
               <a class="btn btn-primary" th:href="@{/empleado/cancelarEditEmpleado}" role="button">CANCELAR</a>
              </div>

            </form>

          </div>
        </div>
      </div>

    </main>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script th:src="@{/bootstrap/js/bootstrap.min.js}"></script>

  </body>
</html>
