<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${titleForm}">Editar Característica</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css" />
</head>
<body>
<div class="app">
  <aside th:replace="fragments/fragments :: sidebar"></aside>
  <div class="main">
    <header th:replace="fragments/fragments :: topnav"></header>

    <main class="content container mt-4">
      <div class="page-header">
        <div>
          <p class="page-subtitle">Gestión de flota</p>
          <h1 th:text="${titleForm}">Alta/Modificación</h1>
        </div>
        <a th:href="@{/caracteristicas-vehiculo}" class="btn btn-light">
          <i class="fa-solid fa-arrow-left"></i> Volver al listado
        </a>
      </div>

      <div class="workflow-tabs">
        <a th:href="@{/caracteristicas-vehiculo}" class="step active">
          <i class="fa-solid fa-gears"></i> 1. Características
        </a>
        <a th:href="@{/vehiculos}" class="step">
          <i class="fa-solid fa-car"></i> 2. Vehículos
        </a>
        <a th:href="@{/costos-vehiculo}" class="step">
          <i class="fa-solid fa-dollar-sign"></i> 3. Costos
        </a>
      </div>

      <form th:action="@{${item.id} != null ? '/caracteristicas-vehiculo/modificar/' + ${item.id} : '/caracteristicas-vehiculo/alta'}"
            th:object="${item}" method="post" enctype="multipart/form-data">
        
        <div class="row">
            <div class="col-md-6 mb-3">
            <label class="form-label">Marca</label>
            <input type="text" class="form-control" th:field="*{marca}" th:disabled="${modoVer}" required>
            </div>
            <div class="col-md-6 mb-3">
            <label class="form-label">Modelo</label>
            <input type="text" class="form-control" th:field="*{modelo}" th:disabled="${modoVer}" required>
            </div>
            <div class="col-md-4 mb-3">
            <label class="form-label">Año</label>
            <input type="number" class="form-control" th:field="*{anio}" th:disabled="${modoVer}">
            </div>
            <div class="col-md-4 mb-3">
            <label class="form-label">Puertas</label>
            <input type="number" class="form-control" th:field="*{cantidadPuertas}" th:disabled="${modoVer}">
            </div>
            <div class="col-md-4 mb-3">
            <label class="form-label">Asientos</label>
            <input type="number" class="form-control" th:field="*{cantidadAsientos}" th:disabled="${modoVer}">
            </div>
            <div class="col-md-6 mb-3">
            <label class="form-label">Total Vehículos</label>
            <input type="number" class="form-control" th:field="*{cantidadTotalVehiculos}" th:disabled="${modoVer}">
            </div>
            <div class="col-md-6 mb-3">
            <label class="form-label">Vehículos Alquilados</label>
            <input type="number" class="form-control" th:field="*{cantidadTotalVehiculosAlquilados}" th:disabled="${modoVer}">
            </div>

            <div class="col-md-6 mb-3" th:if="${item.imagenDataUri != null}">
              <label class="form-label">Imagen actual</label>
              <div class="border rounded p-2 text-center bg-light">
                <img th:src="${item.imagenDataUri}"
                     alt="Imagen vehículo" class="img-fluid rounded" style="max-height: 220px; object-fit: cover;">
              </div>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Archivo de imagen</label>
              <div th:if="${modoVer != true}">
                <input type="file" name="imagenFile" class="form-control" accept="image/*" />
                <small class="text-muted">Subir un nuevo archivo reemplazará la imagen actual</small>
              </div>
              <div th:if="${modoVer == true}">
                <small class="text-muted">Para actualizar la imagen cambie a modo edición.</small>
              </div>
            </div>
        </div>

        <div class="d-flex justify-content-between mt-3">
            <a th:href="@{/caracteristicas-vehiculo}" class="btn btn-secondary">
            <i class="fa-solid fa-arrow-left"></i> Volver
            </a>
            <button type="submit" class="btn btn-primary" th:if="${modoVer != true}">
            <i class="fa-solid fa-save"></i> Guardar
            </button>
        </div>
        </form>
    </main>

    <footer class="footer mt-4">
      © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2025</span> FioriRentCar
    </footer>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
