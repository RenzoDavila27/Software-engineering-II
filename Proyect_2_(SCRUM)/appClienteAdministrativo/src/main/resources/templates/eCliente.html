<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${titleForm}">Gestión de Cliente</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css" />
</head>
<body>
<div class="app">
  <aside th:replace="~{fragments/fragments :: sidebar}"></aside>
  <div class="main">
    <header th:replace="~{fragments/fragments :: topnav}"></header>

    <main class="content container mt-4">
      <h2 th:text="${titleForm}">Alta / Modificación de Cliente</h2>

      <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

      <form th:action="@{${item.id} != null ? '/clientes/modificar/' + ${item.id} : '/clientes/alta'}"
            th:object="${item}"
            method="post">
        <div th:replace="~{fragments/fragments :: csrfInput}"></div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" th:field="*{nombre}" th:disabled="${modoVer}" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Apellido</label>
            <input type="text" class="form-control" th:field="*{apellido}" th:disabled="${modoVer}" required>
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Fecha de nacimiento</label>
            <div th:if="${modoVer}" class="form-control-plaintext border rounded py-2 px-3">
              <span th:text="${detalleFechaNacimiento != null ? #temporals.format(detalleFechaNacimiento, 'dd/MM/yyyy') : 'Sin fecha disponible'}"></span>
            </div>
            <input th:unless="${modoVer}" type="date" class="form-control" th:field="*{fechaNacimiento}" required>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">Tipo de documento</label>
            <select class="form-select" th:field="*{tipoDocumento}" th:disabled="${modoVer}" required>
              <option value="">Seleccione...</option>
              <option th:each="tipo : ${tiposDocumento}"
                      th:value="${tipo}"
                      th:text="${tipo}"></option>
            </select>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">Número de documento</label>
            <input type="text" class="form-control" th:field="*{numeroDocumento}" th:disabled="${modoVer}" required>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Dirección de estadía</label>
            <div th:if="${modoVer}" class="form-control-plaintext border rounded py-2 px-3">
              <span th:text="${detalleDireccionEstadia != null ? detalleDireccionEstadia : 'Sin información'}"></span>
            </div>
            <input th:unless="${modoVer}" type="text" class="form-control" th:field="*{direccionEstadia}" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Nacionalidad</label>
            <select class="form-select" th:field="*{nacionalidadId}" th:disabled="${modoVer}" required>
              <option value="">Seleccione...</option>
              <option th:each="nac : ${nacionalidades}"
                      th:value="${nac.id}"
                      th:text="${nac.nombre}"></option>
            </select>
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Contacto</label>
            <div th:if="${modoVer}" class="form-control-plaintext border rounded py-2 px-3">
              <span th:text="${detalleContacto != null ? detalleContacto : 'Sin datos de contacto'}"></span>
            </div>
            <select th:unless="${modoVer}" class="form-select" th:field="*{contactoId}" required>
              <option value="">Seleccione un contacto</option>
              <option th:each="contacto : ${contactosDisponibles}"
                      th:value="${contacto.value}"
                      th:text="${contacto.label}"></option>
            </select>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">Dirección (registro)</label>
            <div th:if="${modoVer}" class="form-control-plaintext border rounded py-2 px-3">
              <span th:text="${detalleDireccion != null ? detalleDireccion : 'Sin dirección registrada'}"></span>
            </div>
            <select th:unless="${modoVer}" class="form-select" th:field="*{direccionId}" required>
              <option value="">Seleccione una dirección</option>
              <option th:each="direccion : ${direccionesDisponibles}"
                      th:value="${direccion.value}"
                      th:text="${direccion.label}"></option>
            </select>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">Imagen</label>
            <div th:if="${modoVer}" class="border rounded py-2 px-3 text-center">
              <img th:if="${imagenDataUrl != null}" th:src="${imagenDataUrl}" alt="Foto del cliente" style="max-width: 200px; height: auto;">
              <span th:if="${imagenDataUrl == null}">Sin imagen disponible</span>
            </div>
            <select th:unless="${modoVer}" class="form-select" th:field="*{imagenId}" required>
              <option value="">Seleccione una imagen</option>
              <option th:each="imagen : ${imagenesDisponibles}"
                      th:value="${imagen.value}"
                      th:text="${imagen.label}"></option>
            </select>
          </div>
        </div>

        <div class="d-flex justify-content-between mt-3">
          <a th:href="@{/clientes}" class="btn btn-secondary">
            <i class="fa-solid fa-arrow-left"></i> Volver
          </a>
          <button type="submit" class="btn btn-primary" th:if="${!modoVer}">
            <i class="fa-solid fa-save"></i> Guardar
          </button>
        </div>
      </form>
    </main>

    <footer class="footer mt-4">
      © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2025</span> FioriRentCar
    </footer>
  </div>
</div>
</body>
</html>
