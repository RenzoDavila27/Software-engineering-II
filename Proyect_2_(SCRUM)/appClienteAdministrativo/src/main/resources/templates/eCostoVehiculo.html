<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${titleForm}">Formulario Costo Vehículo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css" />
</head>
<body>
<div class="app">
  <aside th:replace="~{fragments/fragments :: sidebar}"></aside>
  <div class="main">
    <header th:replace="~{fragments/fragments :: topnav}"></header>

    <main class="content container mt-4">
      <div class="page-header">
        <div>
          <p class="page-subtitle">Gestión de flota</p>
          <h1 th:text="${titleForm}">Alta/Modificación de costo</h1>
        </div>
        <a th:href="@{/costos-vehiculo}" class="btn btn-light">
          <i class="fa-solid fa-arrow-left"></i> Volver al listado
        </a>
      </div>

      <div class="workflow-tabs">
        <a th:href="${item.caracteristicaVehiculoDto != null && item.caracteristicaVehiculoDto.id != null} ? @{|/caracteristicas-vehiculo/consultar/${item.caracteristicaVehiculoDto.id}|} : @{/caracteristicas-vehiculo}"
           class="step completed">
          <i class="fa-solid fa-circle-check"></i> 1. Características
        </a>
        <a th:href="${item.caracteristicaVehiculoDto != null && item.caracteristicaVehiculoDto.id != null} ? @{|/vehiculos?caracteristicaId=${item.caracteristicaVehiculoDto.id}|} : @{/vehiculos}"
           class="step completed">
          <i class="fa-solid fa-car"></i> 2. Vehículos
        </a>
        <a th:href="${item.caracteristicaVehiculoDto != null && item.caracteristicaVehiculoDto.id != null} ? @{|/costos-vehiculo?caracteristicaId=${item.caracteristicaVehiculoDto.id}|} : @{/costos-vehiculo}"
           class="step active">
          <i class="fa-solid fa-dollar-sign"></i> 3. Costos
        </a>
      </div>

      <div class="alert alert-info d-flex justify-content-between align-items-center"
           th:if="${caracteristicaSeleccionada != null}">
        <span>
          <strong>Característica seleccionada:</strong>
          <span th:text="${caracteristicaSeleccionada.marca + ' ' + caracteristicaSeleccionada.modelo + ' (' + caracteristicaSeleccionada.anio + ')'}"></span>
        </span>
        <a th:href="@{|/caracteristicas-vehiculo/consultar/${caracteristicaSeleccionada.id}|}"
           class="btn btn-light btn-sm">
          <i class="fa-solid fa-eye"></i> Ver detalle
        </a>
      </div>

      <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

      <form th:action="@{${item.id} != null ? '/costos-vehiculo/modificar/' + ${item.id} : '/costos-vehiculo/alta'}"
            th:object="${item}" method="post">
        <div th:replace="~{fragments/fragments :: csrfInput}"></div>

        <div class="row">
          <div class="col-md-12 mb-3">
            <label class="form-label">Característica</label>
            <select class="form-select" th:field="*{caracteristicaVehiculoDto.id}" th:disabled="${modoVer}" required>
              <option value="" disabled th:selected="${item.caracteristicaVehiculoDto == null || item.caracteristicaVehiculoDto.id == null}">Seleccione</option>
              <option th:each="car : ${caracteristicas}"
                      th:value="${car.id}"
                      th:text="${car.marca + ' ' + car.modelo + ' (' + car.anio + ')'}">
              </option>
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Fecha Desde</label>
            <input type="date" class="form-control" th:field="*{fechaDesde}" th:disabled="${modoVer}" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Fecha Hasta</label>
            <input type="date" class="form-control" th:field="*{fechaHasta}" th:disabled="${modoVer}">
            <small class="text-muted">Dejar vacío si el costo sigue vigente.</small>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Costo</label>
            <div class="input-group">
              <span class="input-group-text">$</span>
              <input type="number" min="0" step="0.01" class="form-control"
                     th:field="*{costo}" th:disabled="${modoVer}" required>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-between mt-3">
          <a th:href="@{/costos-vehiculo}" class="btn btn-secondary">
            <i class="fa-solid fa-arrow-left"></i> Volver
          </a>
          <button type="submit" class="btn btn-primary" th:if="${modoVer != true}">
            <i class="fa-solid fa-save"></i> Guardar
          </button>
        </div>
      </form>
    </main>

    <footer class="footer mt-4">
      © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2025</span> FioriRentCar
    </footer>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
