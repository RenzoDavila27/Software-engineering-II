<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${titleForm}">Promoción</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css" />
</head>
<body>
<div class="app">
  <aside th:replace="fragments/fragments :: sidebar"></aside>
  <div class="main">
    <header th:replace="fragments/fragments :: topnav"></header>

    <main class="content container mt-4">
      <div class="page-header">
        <div>
          <p class="page-subtitle">Marketing</p>
          <h1 th:text="${titleForm}">Promoción</h1>
        </div>
        <a th:href="@{/promociones}" class="btn btn-light">
          <i class="fa-solid fa-arrow-left"></i> Volver
        </a>
      </div>

      <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

      <form th:action="@{${item.id} != null ? '/promociones/modificar/' + ${item.id} : '/promociones/alta'}"
            th:object="${item}" method="post">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Código</label>
            <input type="number" min="0" step="1" class="form-control" th:field="*{codigoDescuento}" th:disabled="${modoVer}" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Porcentaje de descuento</label>
            <div class="input-group">
              <input type="number" step="0.01" min="0" max="100" class="form-control"
                     th:field="*{porcentajeDescuento}" th:disabled="${modoVer}" required>
              <span class="input-group-text">%</span>
            </div>
          </div>
          <div class="col-12 mb-3">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" rows="3" th:field="*{descripcionDescuento}" th:disabled="${modoVer}" required></textarea>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Fecha desde</label>
            <input type="date" class="form-control" th:field="*{fechaDesde}" th:disabled="${modoVer}" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Fecha hasta</label>
            <input type="date" class="form-control" th:field="*{fechaHasta}" th:disabled="${modoVer}" required>
          </div>
        </div>

        <div class="d-flex justify-content-between mt-3">
          <a th:href="@{/promociones}" class="btn btn-secondary">
            <i class="fa-solid fa-arrow-left"></i> Volver
          </a>
          <button type="submit" class="btn btn-primary" th:if="${!modoVer}">
            <i class="fa-solid fa-save"></i> Guardar
          </button>
        </div>
      </form>
    </main>

    <footer class="footer mt-4">
      © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2025</span> FioriRentCar
    </footer>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
