<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${titleForm}">Gestionar Provincia</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css" />
</head>
<body>
<div class="app">
  <aside th:replace="fragments/fragments :: sidebar"></aside>
  <div class="main">
    <header th:replace="fragments/fragments :: topnav"></header>

    <main class="content container mt-4">
      <h2 th:text="${titleForm}">Alta/Modificación de Provincia</h2>

      <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

      <form th:action="@{${item.id} != null ? '/provincias/modificar/' + ${item.id} : '/provincias/alta'}"
            th:object="${item}"
            method="post">
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" th:field="*{nombre}" th:disabled="${modoVer}" required>
        </div>

        <div class="mb-3">
          <label class="form-label">País</label>
          <select class="form-select" th:field="*{paisId}" th:disabled="${modoVer}" required>
            <option value="">Seleccione un país</option>
            <option th:each="pais : ${paises}"
                    th:value="${pais.id}"
                    th:text="${pais.nombre}"></option>
          </select>
        </div>

        <div class="d-flex justify-content-between mt-3">
          <a th:href="@{/provincias}" class="btn btn-secondary">
            <i class="fa-solid fa-arrow-left"></i> Volver
          </a>
          <button type="submit" class="btn btn-primary" th:if="${!modoVer}">
            <i class="fa-solid fa-save"></i> Guardar
          </button>
        </div>
      </form>
    </main>

    <footer class="footer mt-4">
      © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2025</span> FioriRentCar
    </footer>
  </div>
</div>
</body>
</html>
