<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${titleForm}">Gestionar Usuario</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css" />
</head>
<body>
<div class="app">
  <aside th:replace="fragments/fragments :: sidebar"></aside>
  <div class="main">
    <header th:replace="fragments/fragments :: topnav"></header>

    <main class="content container mt-4">
      <h2 th:text="${titleForm}">Alta/Modificación de Usuario</h2>

      <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

      <form th:action="@{${item.id} != null ? '/usuarios/modificar/' + ${item.id} : '/usuarios/alta'}"
            th:object="${item}"
            method="post">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Nombre de Usuario</label>
            <input type="text" class="form-control" th:field="*{nombreUsuario}" th:disabled="${modoVer}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Clave</label>
            <input class="form-control"
                   th:attr="type=${modoVer} ? 'text' : 'password'"
                   th:field="*{clave}"
                   th:disabled="${modoVer}"
                   required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Rol</label>
            <select class="form-select" th:field="*{rolUsuario}" th:disabled="${modoVer}" required>
              <option value="" disabled th:selected="${item.rolUsuario == null}">Seleccione un rol</option>
              <option th:each="rol : ${roles}"
                      th:value="${rol}"
                      th:text="${rol}"></option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Persona asociada</label>
            <select class="form-select" th:field="*{personaId}" th:disabled="${modoVer}" required>
              <option value="" disabled th:selected="${item.personaId == null}">Seleccione una persona</option>
              <option th:each="persona : ${personas}"
                      th:value="${persona.id}"
                      th:text="${persona.nombre + ' ' + persona.apellido + ' (' + persona.numeroDocumento + ')'}"></option>
            </select>
          </div>
        </div>

        <div class="d-flex justify-content-between mt-4">
          <a th:href="@{/usuarios}" class="btn btn-secondary">
            <i class="fa-solid fa-arrow-left"></i> Volver
          </a>
          <button type="submit" class="btn btn-primary" th:if="${!modoVer}">
            <i class="fa-solid fa-save"></i> Guardar
          </button>
        </div>
      </form>
    </main>

    <footer class="footer mt-4">
      © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2025</span> FioriRentCar
    </footer>
  </div>
</div>
</body>
</html>
