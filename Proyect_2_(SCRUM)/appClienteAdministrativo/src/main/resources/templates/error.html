<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | FioriRentCar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css" />
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-body text-center py-5">
                    <div class="mb-3 text-danger">
                        <i class="fa-solid fa-triangle-exclamation fa-3x"></i>
                    </div>
                    <h2 class="card-title mb-3">Ups, algo salió mal</h2>
                    <p class="text-muted">Estamos trabajando para solucionar el inconveniente.</p>
                    <p th:if="${statusCode != null}" class="mb-1">
                        <strong>Código:</strong> <span th:text="${statusCode}">500</span>
                    </p>
                    <p class="text-break" th:text="${errorMessage}">Ocurrió un error inesperado.</p>
                    <div class="d-flex flex-column flex-md-row gap-2 justify-content-center mt-4">
                        <a class="btn btn-primary" th:href="@{/}">
                            <i class="fa-solid fa-house"></i> Ir al inicio
                        </a>
                        <a class="btn btn-outline-secondary" href="javascript:history.back()">
                            <i class="fa-solid fa-arrow-left"></i> Volver atrás
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"></script>
</body>
</html>
