<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${titleList}">Alquileres</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css" />
  <style>
    .table-card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
    .styled-table { width: 100%; border-collapse: collapse; }
    .styled-table th, .styled-table td { padding: 12px 14px; text-align: left; }
    .styled-table th { background: #111827; color: #fff; }
    .styled-table tbody tr:nth-of-type(even) { background: #f8fafc; }
    .actions-column { text-align: center; }
    .btn-action { font-size: 0.85rem; padding: 4px 10px; border-radius: 6px; margin: 0 2px; display: inline-block; text-decoration: none; }
    .btn-view { background-color: #198754; color: #fff; }
    .btn-edit { background-color: #ffc107; color: #000; }
    .btn-delete { background-color: #dc3545; color: #fff; }
  </style>
</head>
<body>
<div class="app">
  <aside th:replace="~{fragments/fragments :: sidebar}"></aside>
  <div class="main">
    <header th:replace="~{fragments/fragments :: topnav}"></header>
    <input type="hidden" id="csrfHeader" th:if="${_csrf != null}" th:value="${_csrf.headerName}">
    <input type="hidden" id="csrfToken" th:if="${_csrf != null}" th:value="${_csrf.token}">

    <main class="content">
      <div class="page-header">
        <div>
          <p class="page-subtitle">Operaciones</p>
          <h1 th:text="${titleList}">Alquileres</h1>
        </div>
        <div class="d-flex gap-2 flex-wrap">
          <a th:href="@{/alquileres/alta}" class="btn btn-primary">
            <i class="fa-solid fa-plus"></i> Nuevo alquiler
          </a>
        </div>
      </div>

      <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

      <div class="table-card">
        <table class="styled-table">
          <thead>
          <tr>
            <th>Cliente</th>
            <th>Vehículo</th>
            <th>Período</th>
            <th>Documentación</th>
            <th>Factura</th>
            <th>Entrega</th>
            <th class="actions-column">Acciones</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="item : ${items}">
            <td>
              <span th:text="${clienteMap[item.clienteId] != null ? clienteMap[item.clienteId].nombre + ' ' + clienteMap[item.clienteId].apellido : '-'}"></span>
            </td>
            <td>
              <span th:text="${vehiculoMap[item.vehiculoId] != null ? vehiculoMap[item.vehiculoId].patente : '-'}"></span>
            </td>
            <td>
              <span th:text="${#temporals.format(item.fechaDesde, 'dd/MM/yyyy')}"></span>
              -
              <span th:text="${#temporals.format(item.fechaHasta, 'dd/MM/yyyy')}"></span>
            </td>
            <td>
              <a th:if="${item.documentacionId != null}" th:href="@{|/documentaciones/archivo/${item.documentacionId}|}"
                 class="btn btn-sm btn-outline-secondary">
                <i class="fa-solid fa-file-arrow-down"></i> Descargar
              </a>
              <span th:if="${item.documentacionId == null}" class="text-muted">-</span>
            </td>
            <td>
              <a th:if="${facturas[item.id] != null}" th:href="@{|/alquileres/factura/${item.id}|}"
                 class="btn btn-sm btn-outline-primary">
                <i class="fa-solid fa-file-invoice"></i> Ver factura
              </a>
              <span th:if="${facturas[item.id] == null}" class="text-muted">Pendiente</span>
            </td>
            <td>
              <span th:if="${item.entregado}" class="badge bg-success">
                <i class="fa-solid fa-circle-check me-1"></i> Entregado
              </span>
              <div th:if="${!item.entregado}" class="entrega-actions d-flex flex-column gap-2 flex-md-row">
                <button type="button"
                        class="btn btn-sm btn-outline-success entrega-action"
                        th:data-id="${item.id}"
                        data-endpoint="entrega"
                        data-confirm="¿Confirmás la entrega de este vehículo?">
                  <i class="fa-solid fa-box-open me-1"></i> Entrega
                </button>
                <button type="button"
                        class="btn btn-sm btn-outline-warning text-dark entrega-action"
                        th:data-id="${item.id}"
                        data-endpoint="entrega-error"
                        data-confirm="¡Advertencia! Esta acción marcará la entrega con inconvenientes. ¿Desea continuar?">
                  <i class="fa-solid fa-triangle-exclamation"></i>
                </button>
              </div>
            </td>
            <td class="actions-column">
              <a th:href="@{|/alquileres/consultar/${item.id}|}" class="btn-action btn-view" title="Ver">
                <i class="fa-solid fa-eye"></i>
              </a>
              <a th:href="@{|/alquileres/modificar/${item.id}|}" class="btn-action btn-edit" title="Editar">
                <i class="fa-solid fa-pen"></i>
              </a>
              <a th:href="@{|/alquileres/baja/${item.id}|}" class="btn-action btn-delete" title="Eliminar"
                 onclick="return confirm('¿Desea eliminar este alquiler?');">
                <i class="fa-solid fa-trash"></i>
              </a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(items)}">
            <td colspan="7" class="text-center">No hay alquileres registrados.</td>
          </tr>
          </tbody>
        </table>
      </div>
    </main>

    <footer class="footer">
      © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2025</span> FioriRentCar
    </footer>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const headerInput = document.getElementById('csrfHeader');
    const tokenInput = document.getElementById('csrfToken');
    const csrfHeader = headerInput ? headerInput.value : 'X-CSRF-TOKEN';
    const csrfToken = tokenInput ? tokenInput.value : '';

    document.querySelectorAll('.entrega-action').forEach(function (button) {
      button.addEventListener('click', function () {
        const alquilerId = button.dataset.id;
        const endpoint = button.dataset.endpoint;
        const confirmMessage = button.dataset.confirm || '¿Desea continuar con la acción?';
        if (!alquilerId || !endpoint) {
          return;
        }
        if (!confirm(confirmMessage)) {
          return;
        }
        toggleEntregaButtons(button, true);
        fetch(`/alquileres/${alquilerId}/${endpoint}`, {
          method: 'POST',
          headers: Object.assign({'Content-Type': 'application/json'}, csrfToken ? {[csrfHeader]: csrfToken} : {})
        }).then(function (response) {
          if (!response.ok) {
            return response.text().then(function (text) { throw new Error(text || 'No se pudo registrar la entrega.'); });
          }
          const contenedor = button.closest('.entrega-actions');
          if (contenedor) {
            contenedor.innerHTML = construirBadge(endpoint);
          }
        }).catch(function (error) {
          alert(error.message);
          toggleEntregaButtons(button, false);
        });
      });
    });

    function toggleEntregaButtons(button, disabled) {
      const contenedor = button.closest('.entrega-actions');
      const botones = contenedor ? contenedor.querySelectorAll('.entrega-action') : [button];
      botones.forEach(function (btn) { btn.disabled = disabled; });
    }

    function construirBadge(endpoint) {
      if (endpoint === 'entrega-error') {
        return '<span class="badge bg-warning text-dark"><i class="fa-solid fa-triangle-exclamation me-1"></i> Entrega con error</span>';
      }
      return '<span class="badge bg-success"><i class="fa-solid fa-circle-check me-1"></i> Entregado</span>';
    }
  });
</script>
</body>
</html>
