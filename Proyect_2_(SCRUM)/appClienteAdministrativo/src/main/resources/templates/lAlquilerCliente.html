<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${titleList}">Historial de alquileres</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css" />
  <style>
    .table-card { background: #ffffff; padding: 24px; border-radius: 14px; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08); }
    .styled-table { width: 100%; border-collapse: collapse; }
    .styled-table th, .styled-table td { padding: 14px; text-align: left; }
    .styled-table th { background: #0f172a; color: #fff; font-weight: 600; }
    .styled-table tbody tr:nth-of-type(even) { background: #f8fafc; }
    .badge-invoice { background-color: #0d6efd; color: #fff; font-size: 0.8rem; border-radius: 999px; padding: 4px 10px; }
    .invoice-actions a { margin-right: 8px; }
  </style>
</head>
<body>
<div class="app">
  <aside th:replace="~{fragments/fragments :: sidebar}"></aside>
  <div class="main">
    <header th:replace="~{fragments/fragments :: topnav}"></header>

    <main class="content">
      <div class="page-header">
        <div>
          <p class="page-subtitle">Mis alquileres</p>
          <h1 th:text="${titleList}">Historial de alquileres</h1>
          <p class="text-muted" th:if="${clienteActual != null}">
            <i class="fa-solid fa-id-badge"></i>
            <span th:text="${clienteActual.nombre} + ' ' + ${clienteActual.apellido}">Cliente</span>
          </p>
        </div>
        <div class="d-flex gap-2 flex-wrap" th:if="${!esRolCliente}">
          <a th:href="@{/alquileres}" class="btn btn-outline-secondary">
            <i class="fa-solid fa-arrow-left"></i> Volver a gestión
          </a>
        </div>
      </div>

      <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

      <div class="table-card">
        <table class="styled-table">
          <thead>
          <tr>
            <th>Vehículo</th>
            <th>Período</th>
            <th>Factura</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="item : ${items}">
            <td>
              <div class="fw-semibold" th:text="${vehiculoMap[item.vehiculoId] != null ? vehiculoMap[item.vehiculoId].patente : 'Vehículo sin informar'}">Vehículo</div>
              <div class="text-muted small">
                Documentación:
                <span th:text="${item.documentacionId != null ? 'Adjunta' : 'No disponible'}"></span>
              </div>
            </td>
            <td>
              <span th:text="${#temporals.format(item.fechaDesde, 'dd/MM/yyyy')}"></span>
              &mdash;
              <span th:text="${#temporals.format(item.fechaHasta, 'dd/MM/yyyy')}"></span>
            </td>
            <td>
              <div th:if="${facturas[item.id] != null}" class="invoice-actions">
                <span class="badge-invoice mb-2">Facturado</span>
                <div>
                  <a th:href="@{|/alquileres/factura/${item.id}|}" class="btn btn-sm btn-outline-primary">
                    <i class="fa-solid fa-file-invoice"></i> Ver
                  </a>
                  <a th:href="@{|/alquileres/factura/${item.id}/pdf|}" class="btn btn-sm btn-outline-success">
                    <i class="fa-solid fa-file-arrow-down"></i> Descargar PDF
                  </a>
                </div>
              </div>
              <span th:if="${facturas[item.id] == null}" class="text-muted">Pendiente de facturación</span>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(items)}">
            <td colspan="3" class="text-center text-muted py-4">
              No se registran alquileres para mostrar.
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </main>

    <footer class="footer">
      © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2025</span> FioriRentCar
    </footer>
  </div>
</div>

<script th:src="@{/js/app.js}" src="/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
