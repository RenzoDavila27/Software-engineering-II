<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${titleList}">Listado de Países</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- CSS General -->
  <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css" />

  <style>
    /* ===== Tabla y botones aislados ===== */
    .table-card {
      background: #fff !important;
      padding: 20px !important;
      border-radius: 12px !important;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1) !important;
      overflow-x: auto !important;
      margin-top: 20px;
    }

    .styled-table {
      width: 100% !important;
      border-collapse: collapse !important;
    }

    .styled-table th, .styled-table td {
      padding: 12px 15px !important;
      text-align: center !important;
    }

    .styled-table th {
      background-color: #343a40 !important;
      color: #fff !important;
      font-weight: 600 !important;
    }

    .styled-table tbody tr {
      border-bottom: 1px solid #ddd !important;
    }

    .styled-table tbody tr:nth-of-type(even) {
      background-color: #f8f9fa !important;
    }

    .styled-table tbody tr:hover {
      background-color: #e9ecef !important;
    }

    .actions-column {
      text-align: center !important;
    }

    .btn-action {
      font-size: 0.85rem !important;
      padding: 4px 10px !important;
      border-radius: 6px !important;
      margin: 0 2px !important;
      text-decoration: none !important;
      display: inline-block !important;
    }

    .btn-view { background-color: #198754 !important; color: #fff !important; }
    .btn-view:hover { background-color: #157347 !important; }

    .btn-edit { background-color: #ffc107 !important; color: #000 !important; }
    .btn-edit:hover { background-color: #e6ac00 !important; color: #000 !important; }

    .btn-delete { background-color: #dc3545 !important; color: #fff !important; }
    .btn-delete:hover { background-color: #b02a37 !important; color: #fff !important; }

    /* Botón agregar */
    .actions .btn-primary {
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside th:replace="fragments/fragments :: sidebar"></aside>

  <!-- MAIN -->
  <div class="main">
    <!-- TOP NAV -->
    <header th:replace="fragments/fragments :: topnav"></header>

    <!-- CONTENIDO -->
    <main class="content">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 th:text="${titleList}">Listado de Países</h1>
        <a th:href="@{/paises/alta}" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Agregar País</a>
      </div>

      <div class="table-card">
        <table class="styled-table">
          <thead>
            <tr>
              <th>Nombre</th>
              <th class="actions-column">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="item : ${items}">
              <td th:text="${item.nombre}"></td>
              <td class="actions-column">
                <a th:href="@{|/pais/consultar/${item.id}|}" class="btn-action btn-view" title="Ver">
                  <i class="fa-solid fa-eye"></i> Ver
                </a>
                <a th:href="@{|/pais/modificar/${item.id}|}" class="btn-action btn-edit" title="Editar">
                  <i class="fa-solid fa-pen"></i> Editar
                </a>
                <a th:href="@{|/pais/baja/${item.id}|}" class="btn-action btn-delete" title="Eliminar"
                   onclick="return confirm('¿Seguro que desea eliminar este país?');">
                  <i class="fa-solid fa-trash"></i> Eliminar
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
      © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2025</span> FioriRentCar
    </footer>
  </div>
</div>

<!-- Bootstrap JS -->
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
