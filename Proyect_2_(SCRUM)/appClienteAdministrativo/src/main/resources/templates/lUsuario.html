<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${titleList}">Listado de Usuarios</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css" />

  <style>
    .table-card {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      overflow-x: auto;
    }
    .styled-table {
      width: 100%;
      border-collapse: collapse;
    }
    .styled-table th,
    .styled-table td {
      padding: 12px 15px;
      text-align: center;
    }
    .styled-table th {
      background-color: #0f172a;
      color: #fff;
    }
    .actions-column {
      white-space: nowrap;
    }
    .btn-action {
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 6px;
      margin: 0 2px;
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>
<div class="app">
  <aside th:replace="~{fragments/fragments :: sidebar}"></aside>

  <div class="main">
    <header th:replace="~{fragments/fragments :: topnav}"></header>

    <main class="content">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 th:text="${titleList}">Listado de Usuarios</h1>
        <a th:href="@{/usuarios/alta}" class="btn btn-primary">
          <i class="fa-solid fa-plus"></i> Nuevo Usuario
        </a>
      </div>

      <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

      <div class="table-card">
        <table class="styled-table">
          <thead>
          <tr>
            <th>Usuario</th>
            <th>Rol</th>
            <th>Persona asociada</th>
            <th class="actions-column">Acciones</th>
          </tr>
          </thead>
          <tbody>
          <tr th:if="${#lists.isEmpty(items)}">
            <td colspan="4" class="text-center text-muted py-4">No hay usuarios registrados.</td>
          </tr>
          <tr th:each="item : ${items}">
            <td th:text="${item.nombreUsuario}">usuario</td>
            <td th:text="${item.rolUsuario}">ROL</td>
            <td th:text="${personaNombrePorId[item.personaId]} ?: 'Sin persona asociada'">Persona</td>
            <td class="actions-column">
              <a th:href="@{|/usuarios/consultar/${item.id}|}" class="btn-action btn btn-success btn-sm">
                <i class="fa-solid fa-eye"></i>
              </a>
              <a th:href="@{|/usuarios/modificar/${item.id}|}" class="btn-action btn btn-warning btn-sm">
                <i class="fa-solid fa-pen"></i>
              </a>
              <a th:href="@{|/usuarios/baja/${item.id}|}"
                 class="btn-action btn btn-danger btn-sm"
                 onclick="return confirm('¿Seguro que desea eliminar este usuario?');">
                <i class="fa-solid fa-trash"></i>
              </a>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </main>

    <footer class="footer">
      © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2025</span> FioriRentCar
    </footer>
  </div>
</div>

<script th:src="@{/js/app.js}" src="/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
