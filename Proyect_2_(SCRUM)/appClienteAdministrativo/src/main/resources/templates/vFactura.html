<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factura</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css" />
</head>
<body>
<div class="app">
  <aside th:replace="~{fragments/fragments :: sidebar}"></aside>
  <div class="main">
    <header th:replace="~{fragments/fragments :: topnav}"></header>

    <main class="content container mt-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <p class="page-subtitle">Comprobantes</p>
          <h1>Factura <span th:text="${vista.factura.numeroFactura}"></span></h1>
        </div>
        <div class="d-flex gap-2">
          <a th:if="${vista.alquiler != null}" th:href="@{|/alquileres/factura/${vista.alquiler.id}/pdf|}" class="btn btn-primary">
            <i class="fa-solid fa-file-arrow-down"></i> Descargar PDF
          </a>
          <a th:href="@{/alquileres}" class="btn btn-light">
            <i class="fa-solid fa-arrow-left"></i> Volver
          </a>
        </div>
      </div>

      <div class="card mb-3">
        <div class="card-body row">
          <div class="col-md-6">
            <h6 class="text-muted">Datos del cliente</h6>
            <p class="mb-1" th:text="${vista.cliente != null ? vista.cliente.nombre + ' ' + vista.cliente.apellido : ' - '}"></p>
            <small class="text-muted">Documento:
              <span th:text="${vista.cliente != null ? vista.cliente.tipoDocumento + ' ' + vista.cliente.numeroDocumento : '-'}"></span>
            </small>
          </div>
          <div class="col-md-6">
            <h6 class="text-muted">Información del alquiler</h6>
            <p class="mb-1" th:text="${vista.vehiculo != null ? vista.vehiculo.patente : '-'}"></p>
            <small class="text-muted">
              <span th:text="${vista.alquiler != null ? #temporals.format(vista.alquiler.fechaDesde, 'dd/MM/yyyy') : '-'}"></span>
              -
              <span th:text="${vista.alquiler != null ? #temporals.format(vista.alquiler.fechaHasta, 'dd/MM/yyyy') : '-'}"></span>
            </small>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table">
              <thead>
              <tr>
                <th>Descripción</th>
                <th>Promoción aplicada</th>
                <th class="text-end">Subtotal</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="linea : ${vista.detalles}">
                <td>
                  Alquiler <span th:text="${linea.detalle.alquilerId}"></span>
                </td>
                <td th:text="${linea.promocion != null ? linea.promocion.descripcionDescuento : 'Sin descuento'}"></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(linea.detalle.subtotal,1,'POINT',2,'POINT')}"></td>
              </tr>
              </tbody>
              <tfoot>
              <tr>
                <th colspan="2" class="text-end">Total</th>
                <th class="text-end" th:text="${#numbers.formatDecimal(vista.factura.totalPagado,1,'POINT',2,'POINT')}"></th>
              </tr>
              </tfoot>
            </table>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer mt-4">
      © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2025</span> FioriRentCar
    </footer>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
