<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>FioriRent's - Reservar Vehículo</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link th:href="@{/lib/animate/animate.min.css}" rel="stylesheet">
    <link th:href="@{/lib/owlcarousel/assets/owl.carousel.min.css}" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

<div th:replace="~{topbar :: body}"></div>

<!-- Header Start -->
<div class="container-fluid bg-breadcrumb mb-5">
    <div class="container text-center py-5" style="max-width: 900px;">
        <h4 class="text-white display-4 mb-4 wow fadeInDown" data-wow-delay="0.1s">Reservar Vehículo</h4>
        <ol class="breadcrumb d-flex justify-content-center mb-0 wow fadeInDown" data-wow-delay="0.3s">
            <li class="breadcrumb-item"><a th:href="@{/}">Inicio</a></li>
            <li class="breadcrumb-item"><a th:href="@{/vehiculos}">Vehículos</a></li>
            <li class="breadcrumb-item active text-primary">Reservar</li>
        </ol>
    </div>
</div>
<!-- Header End -->

<!-- Booking Start -->
<div class="container-fluid contact py-5">
    <div class="container">
        <div class="row g-5">
            <div class="col-lg-5 wow fadeInUp" data-wow-delay="0.1s">
                <div class="bg-secondary p-4 rounded" th:object="${vehiculo}">
                    <h4 class="text-white text-center mb-4" th:text="*{caracteristicaVehiculo.marca + ' ' + caracteristicaVehiculo.modelo}"></h4>
                    <div class="categories-img rounded">
                        <img th:if="*{caracteristicaVehiculo.imagenDto != null && caracteristicaVehiculo.imagenDto.contenido != null}" th:src="'data:image/png;base64,' + *{caracteristicaVehiculo.imagenDto.getContenidoAsBase64()}" class="img-fluid w-100 rounded" alt="">
                        <img th:if="*{caracteristicaVehiculo.imagenDto == null || caracteristicaVehiculo.imagenDto.contenido == null}" th:src="@{/img/car-1.png}" class="img-fluid w-100 rounded" alt="">
                    </div>
                    <div class="row gy-2 gx-0 text-center mt-3">
                        <div class="col-6">
                            <i class="fa fa-users text-white"></i> <span class="text-white ms-1" th:text="*{caracteristicaVehiculo.cantidadAsientos + ' Asientos'}"></span>
                        </div>
                        <div class="col-6">
                            <i class="fa fa-car text-white"></i> <span class="text-white ms-1" th:text="*{caracteristicaVehiculo.cantidadPuertas + ' Puertas'}"></span>
                        </div>
                        <div class="col-6">
                            <i class="fa fa-car text-white"></i> <span class="text-white ms-1" th:text="*{caracteristicaVehiculo.anio}"></span>
                        </div>
                        <div class="col-6 mt-2">
                            <i class="fa fa-car text-white"></i> <span class = "text-white ms-1" th:text="*{'Disponibles: ' + (caracteristicaVehiculo.cantidadTotalVehiculos - caracteristicaVehiculo.cantidadTotalVehiculosAlquilados)}"></span>
                        </div>
                        <div class="col-12 mt-2">
                            <h5 class="text-white text-center mb-0" th:text="${'$' + vehiculo.costoVehiculo.costo + '/Día'}"></h5>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-7 wow fadeInUp" data-wow-delay="0.3s">
                <div class="bg-secondary p-5 rounded">
                    <h3 class="text-white text-center mb-4">Formulario de Reserva</h3>
                    <form id="bookingForm" th:action="@{/payment}" method="get">
                        <input type="hidden" name="vehiculoId" th:value="${vehiculo.id}">
                        <input type="hidden" name="costPerDay" th:value="${vehiculo.costoVehiculo.costo}">
                        <input type="hidden" name="rentalDays" id="rentalDaysInput">
                        <div class="row g-3">
                            <div class="col-12">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="vehiculo" th:value="${vehiculo.caracteristicaVehiculo.marca + ' ' + vehiculo.caracteristicaVehiculo.modelo}" readonly>
                                    <label for="vehiculo">Vehículo</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-floating">
                                    <input class="form-control" type="date" id="fechaRetiro" name="fechaDesde" required>
                                    <label for="fechaRetiro">Fecha de Retiro</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-floating">
                                    <input class="form-control" type="date" id="fechaEntrega" name="fechaHasta" required>
                                    <label for="fechaEntrega">Fecha de Entrega</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <h4 class="text-white mt-4">Documentación</h4>
                                <div class="mb-3">
                                    <label for="docDni" class="form-label text-white">DNI (PDF o Word)</label>
                                    <input class="form-control" type="file" id="docDni" accept=".pdf,.doc,.docx">
                                </div>
                                <div class="mb-3">
                                    <label for="docLicencia" class="form-label text-white">Licencia de Conducir (PDF o Word)</label>
                                    <input class="form-control" type="file" id="docLicencia" accept=".pdf,.doc,.docx">
                                </div>
                            </div>
                            <div class="col-12">
                                <button class="btn btn-light w-100 py-3" type="submit" id="reserveButton">Reservar Ahora</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Booking End -->

<div th:replace="~{bottombar :: body}"></div>

<!-- JavaScript Libraries -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/lib/wow/wow.min.js}"></script>
<script th:src="@{/lib/easing/easing.min.js}"></script>
<script th:src="@{/lib/waypoints/waypoints.min.js}"></script>
<script th:src="@{/lib/owlcarousel/owl.carousel.min.js}"></script>

<!-- Template Javascript -->
<script th:src="@{/js/main.js}"></script>
<script>
    document.getElementById('bookingForm').addEventListener('submit', function(event) {
        const fechaRetiro = new Date(document.getElementById('fechaRetiro').value);
        const fechaEntrega = new Date(document.getElementById('fechaEntrega').value);

        if (isNaN(fechaRetiro) || isNaN(fechaEntrega) || fechaRetiro >= fechaEntrega) {
            alert('Por favor, selecciona fechas de retiro y entrega válidas. La fecha de entrega debe ser posterior a la de retiro.');
            event.preventDefault();
            return;
        }

        const diffTime = Math.abs(fechaEntrega - fechaRetiro);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        document.getElementById('rentalDaysInput').value = diffDays;
    });
</script>
</body>

</html>
