<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>FioriRent's - Pago</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link th:href="@{/lib/animate/animate.min.css}" rel="stylesheet">
    <link th:href="@{/lib/owlcarousel/assets/owl.carousel.min.css}" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

<div th:replace="~{topbar :: body}"></div>

<!-- Header Start -->
<div class="container-fluid bg-breadcrumb mb-5">
    <div class="container text-center py-5" style="max-width: 900px;">
        <h4 class="text-white display-4 mb-4 wow fadeInDown" data-wow-delay="0.1s">Realizar Pago</h4>
        <ol class="breadcrumb d-flex justify-content-center mb-0 wow fadeInDown" data-wow-delay="0.3s">
            <li class="breadcrumb-item"><a th:href="@{/}">Inicio</a></li>
            <li class="breadcrumb-item"><a th:href="@{/vehiculos}">Vehículos</a></li>
            <li class="breadcrumb-item"><a th:href="@{/book}">Reservar</a></li>
            <li class="breadcrumb-item active text-primary">Pago</li>
        </ol>
    </div>
</div>
<!-- Header End -->

<!-- Payment Start -->
<div class="container-fluid py-5">
    <div class="container">
        <div class="row g-5">
            <div class="col-lg-5 wow fadeInUp" data-wow-delay="0.1s">
                <div class="bg-secondary p-4 rounded" th:object="${vehiculo}">
                    <h4 class="text-white text-center mb-4" th:text="*{caracteristicaVehiculo.marca + ' ' + caracteristicaVehiculo.modelo}"></h4>
                    <div class="categories-img rounded">
                        <img th:if="*{caracteristicaVehiculo.imagenDto != null && caracteristicaVehiculo.imagenDto.contenido != null}" th:src="'data:image/png;base64,' + *{caracteristicaVehiculo.imagenDto.getContenidoAsBase64()}" class="img-fluid w-100 rounded" alt="">
                        <img th:if="*{caracteristicaVehiculo.imagenDto == null || caracteristicaVehiculo.imagenDto.contenido == null}" th:src="@{/img/car-1.png}" class="img-fluid w-100 rounded" alt="">
                    </div>
                    <div class="row gy-2 gx-0 text-center mt-3">
                        <div class="col-12 mt-2">
                            <h5 class="text-white text-center mb-0" th:text="${'Total a Pagar: $' + #numbers.formatDecimal(totalPrice, 0, 'COMMA', 2, 'POINT')}"></h5>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-7 wow fadeInUp" data-wow-delay="0.3s">
                <div class="bg-secondary p-5 rounded">
                    <h3 class="text-white text-center mb-4">Selecciona tu Método de Pago</h3>
                    <form id="paymentForm" th:action="@{/payment/process}" method="post">
                        <input type="hidden" name="vehiculoId" th:value="${vehiculo.id}">
                        <input type="hidden" name="rentalDays" th:value="${rentalDays}">
                        <input type="hidden" name="totalPrice" th:value="${totalPrice}">

                        <div class="mb-3">
                            <div class="form-check text-white">
                                <input class="form-check-input" type="radio" name="paymentMethod" id="efectivo" value="efectivo" checked>
                                <label class="form-check-label" for="efectivo">
                                    Efectivo
                                </label>
                            </div>
                            <div class="form-check text-white">
                                <input class="form-check-input" type="radio" name="paymentMethod" id="transferencia" value="transferencia">
                                <label class="form-check-label" for="transferencia">
                                    Transferencia Bancaria
                                </label>
                            </div>
                            <div class="form-check text-white">
                                <input class="form-check-input" type="radio" name="paymentMethod" id="mercadoPago" value="mercadoPago">
                                <label class="form-check-label" for="mercadoPago">
                                    Mercado Pago
                                </label>
                            </div>
                        </div>

                        <div id="efectivoDetails" class="payment-details mb-4">
                            <p class="text-white">Su alquiler quedará registrado y deberá abonar el día de retiro.</p>
                            <button type="submit" class="btn btn-light w-100 py-3">Terminar Pedido</button>
                        </div>

                        <div id="transferenciaDetails" class="payment-details mb-4" style="display: none;">
                            <p class="text-white">Una vez realizado el alquiler, se deberá transferir a estos datos:</p>
                            <p class="text-white">Alias: mycar.mp</p>
                            <p class="text-white">CBU: 123456789</p>
                            <p class="text-white">Banco: BancoFioriTech</p>
                            <button type="submit" class="btn btn-light w-100 py-3">Terminar Pago</button>
                        </div>

                        <div id="mercadoPagoDetails" class="payment-details mb-4" style="display: none;">
                            <button type="submit" class="btn btn-light w-100 py-3">Proceder con el pago</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Payment End -->

<div th:replace="~{bottombar :: body}"></div>

<!-- JavaScript Libraries -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/lib/wow/wow.min.js}"></script>
<script th:src="@{/lib/easing/easing.min.js}"></script>
<script th:src="@{/lib/waypoints/waypoints.min.js}"></script>
<script th:src="@{/lib/owlcarousel/owl.carousel.min.js}"></script>

<!-- Template Javascript -->
<script th:src="@{/js/main.js}"></script>
<script>
    document.querySelectorAll('input[name="paymentMethod"]').forEach(radio => {
        radio.addEventListener('change', function() {
            document.querySelectorAll('.payment-details').forEach(div => {
                div.style.display = 'none';
            });
            document.getElementById(this.value + 'Details').style.display = 'block';
        });
    });
</script>
</body>

</html>
