<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Cental - Registro</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link th:href="@{/lib/animate/animate.min.css}" rel="stylesheet">
    <link th:href="@{/lib/owlcarousel/assets/owl.carousel.min.css}" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

<div th:replace="~{topbar :: body}"></div>

<!-- Header Start -->
<div class="container-fluid bg-breadcrumb mb-5">
    <div class="container text-center py-5" style="max-width: 900px;">
        <h4 class="text-white display-4 mb-4 wow fadeInDown" data-wow-delay="0.1s">Registro de Usuario</h4>
        <ol class="breadcrumb d-flex justify-content-center mb-0 wow fadeInDown" data-wow-delay="0.3s">
            <li class="breadcrumb-item"><a th:href="@{/}">Inicio</a></li>
            <li class="breadcrumb-item"><a href="#">Páginas</a></li>
            <li class="breadcrumb-item active text-primary">Registro</li>
        </ol>
    </div>
</div>
<!-- Header End -->

<!-- Register Start -->
<div class="container-fluid contact py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10 wow fadeInUp" data-wow-delay="0.1s">
                <div class="bg-secondary p-5 rounded">
                    <h3 class="text-white text-center mb-4">Formulario de Registro</h3>
                    <form>
                        <!-- Personal Data -->
                        <h4 class="text-white mb-3">Datos Personales</h4>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="firstName" placeholder="Nombre">
                                    <label for="firstName">Nombre</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="lastName" placeholder="Apellido">
                                    <label for="lastName">Apellido</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="date" class="form-control" id="birthDate" placeholder="Fecha de Nacimiento">
                                    <label for="birthDate">Fecha de Nacimiento</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <select class="form-select" id="docType">
                                        <option selected>Seleccione un tipo</option>
                                        <option value="ID">DNI</option>
                                        <option value="PASSPORT">Pasaporte</option>
                                        <option value="OTHER">Otro</option>
                                    </select>
                                    <label for="docType">Tipo de Documento</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="docNumber" placeholder="Número de Documento">
                                    <label for="docNumber">Número de Documento</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="photo" class="form-label text-white">Foto</label>
                                <input class="form-control" type="file" id="photo">
                            </div>
                        </div>

                        <hr class="my-4">

                        <!-- Contact Data -->
                        <h4 class="text-white mb-3">Datos de Contacto</h4>
                        <div id="contact-list" class="mb-3">
                            <!-- Contact items will be added here -->
                        </div>
                        <button type="button" class="btn btn-light" data-bs-toggle="modal" data-bs-target="#contactModal">
                            Agregar Contacto
                        </button>

                        <hr class="my-4">

                        <!-- Address (personal) -->
                        <h4 class="text-white mb-3">Dirección Personal</h4>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="street" placeholder="Calle">
                                    <label for="street">Calle</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="houseNumber" placeholder="Número">
                                    <label for="houseNumber">Número</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="neighborhood" placeholder="Barrio (Opcional)">
                                    <label for="neighborhood">Barrio (Opcional)</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="block" placeholder="Manzana (Opcional)">
                                    <label for="block">Manzana (Opcional)</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="floor" placeholder="Piso (Opcional)">
                                    <label for="floor">Piso (Opcional)</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="apartment" placeholder="Departamento (Opcional)">
                                    <label for="apartment">Departamento (Opcional)</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="landmarks" placeholder="Punto de Referencia (Opcional)">
                                    <label for="landmarks">Punto de Referencia (Opcional)</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="city" placeholder="Ciudad/Localidad">
                                    <label for="city">Ciudad/Localidad</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="postalCode" placeholder="Código Postal">
                                    <label for="postalCode">Código Postal</label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="department" placeholder="Departamento">
                                    <label for="department">Departamento</label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="province" placeholder="Provincia">
                                    <label for="province">Provincia</label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-floating">
                                    <select class="form-select" id="country">
                                        <option selected>Seleccione un país</option>
                                        <option value="AR">Argentina</option>
                                        <option value="BO">Bolivia</option>
                                        <option value="BR">Brasil</option>
                                        <option value="CL">Chile</option>
                                        <option value="CO">Colombia</option>
                                        <option value="PY">Paraguay</option>
                                        <option value="PE">Perú</option>
                                        <option value="UY">Uruguay</option>
                                        <option value="VE">Venezuela</option>
                                    </select>
                                    <label for="country">País</label>
                                </div>
                            </div>
                        </div>

                        <hr class="my-4">

                        <!-- Address (accommodation) -->
                        <h4 class="text-white mb-3">Dirección de Alojamiento</h4>
                        <div class="row g-3">
                            <div class="col-12">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="accommodationAddress" placeholder="Dirección de Alojamiento">
                                    <label for="accommodationAddress">Dirección de Alojamiento</label>
                                </div>
                            </div>
                        </div>

                        <hr class="my-4">

                        <!-- Login information -->
                        <h4 class="text-white mb-3">Información de Inicio de Sesión</h4>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="email" class="form-control" id="email" placeholder="Correo Electrónico">
                                    <label for="email">Correo Electrónico</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="password" class="form-control" id="password" placeholder="Contraseña">
                                    <label for="password">Contraseña</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="password" class="form-control" id="confirmPassword" placeholder="Confirmar Contraseña">
                                    <label for="confirmPassword">Confirmar Contraseña</label>
                                </div>
                            </div>
                        </div>

                        <div class="col-12 mt-4">
                            <button class="btn btn-light w-100 py-3" type="submit">Registrarse</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Register End -->

<!-- Contact Modal -->
<div class="modal fade" id="contactModal" tabindex="-1" aria-labelledby="contactModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content bg-secondary">
            <div class="modal-header">
                <h5 class="modal-title text-white" id="contactModalLabel">Agregar Contacto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="contactForm">
                    <div class="mb-3">
                        <label for="contactType" class="form-label text-white">Tipo</label>
                        <select class="form-select" id="contactType">
                            <option value="WORK">Trabajo</option>
                            <option value="PERSONAL">Personal</option>
                            <option value="COMPANY">Empresa</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="contactNote" class="form-label text-white">Nota (Opcional)</label>
                        <input type="text" class="form-control" id="contactNote">
                    </div>
                    <div class="mb-3">
                        <label for="communicationMethod" class="form-label text-white">Método de Comunicación</label>
                        <select class="form-select" id="communicationMethod">
                            <option value="EMAIL">Correo Electrónico</option>
                            <option value="PHONE">Teléfono</option>
                        </select>
                    </div>
                    <div id="email-fields">
                        <div class="mb-3">
                            <label for="contactEmail" class="form-label text-white">Correo Electrónico</label>
                            <input type="email" class="form-control" id="contactEmail">
                        </div>
                    </div>
                    <div id="phone-fields" style="display: none;">
                        <div class="mb-3">
                            <label for="phoneNumber" class="form-label text-white">Número de Teléfono</label>
                            <input type="text" class="form-control" id="phoneNumber">
                        </div>
                        <div class="mb-3">
                            <label for="phoneType" class="form-label text-white">Tipo de Teléfono</label>
                            <select class="form-select" id="phoneType">
                                <option value="MOBILE">Móvil</option>
                                <option value="LANDLINE">Fijo</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-dark" data-bs-dismiss="modal">Cerrar</button>
                <button type="button" class="btn btn-light" id="saveContact">Guardar Contacto</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{bottombar :: body}"></div>

<!-- JavaScript Libraries -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/lib/wow/wow.min.js}"></script>
<script th:src="@{/lib/easing/easing.min.js}"></script>
<script th:src="@{/lib/waypoints/waypoints.min.js}"></script>
<script th:src="@{/lib/owlcarousel/owl.carousel.min.js}"></script>

<!-- Template Javascript -->
<script th:src="@{/js/main.js}"></script>
<script>
    document.getElementById('communicationMethod').addEventListener('change', function () {
        var emailFields = document.getElementById('email-fields');
        var phoneFields = document.getElementById('phone-fields');
        if (this.value === 'PHONE') {
            emailFields.style.display = 'none';
            phoneFields.style.display = 'block';
        } else {
            emailFields.style.display = 'block';
            phoneFields.style.display = 'none';
        }
    });

    document.getElementById('saveContact').addEventListener('click', function () {
        var contactType = document.getElementById('contactType').value;
        var contactNote = document.getElementById('contactNote').value;
        var communicationMethod = document.getElementById('communicationMethod').value;
        var contactValue;
        if (communicationMethod === 'EMAIL') {
            contactValue = document.getElementById('contactEmail').value;
        } else {
            contactValue = document.getElementById('phoneNumber').value + ' (' + document.getElementById('phoneType').value + ')';
        }

        if (!contactValue) {
            alert('Por favor, complete el campo de contacto.');
            return;
        }

        var contactList = document.getElementById('contact-list');
        var contactItem = document.createElement('div');
        contactItem.className = 'alert alert-light alert-dismissible fade show';
        contactItem.setAttribute('role', 'alert');
        contactItem.innerHTML = '<strong>' + contactType + ':</strong> ' + contactValue + (contactNote ? ' (' + contactNote + ')' : '') +
            '<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>';
        contactList.appendChild(contactItem);

        // Clear form and close modal
        document.getElementById('contactForm').reset();
        var modal = bootstrap.Modal.getInstance(document.getElementById('contactModal'));
        modal.hide();
    });
</script>
</body>

</html>
