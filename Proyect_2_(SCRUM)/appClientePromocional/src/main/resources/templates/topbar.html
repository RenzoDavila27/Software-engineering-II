<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <!-- Topbar Start -->
    <div class="container-fluid topbar bg-secondary d-none d-xl-block w-100">
        <div class="container">
            <div class="row gx-0 align-items-center" style="height: 45px;">
                <div class="col-lg-6 text-center text-lg-start mb-lg-0">
                    <div class="d-flex flex-wrap">
                        <a href="#" class="text-muted me-4"><i class="fas fa-map-marker-alt text-primary me-2"></i>Encuentra una Sucursal</a>
                        <a href="tel:+01234567890" class="text-muted me-4"><i class="fas fa-phone-alt text-primary me-2"></i>+01234567890</a>
                        <a href="mailto:info@mycar.com" class="text-muted me-0"><i class="fas fa-envelope text-primary me-2"></i>info@mycar.com</a>
                    </div>
                </div>
                <div class="col-lg-6 text-center text-lg-end">
                    <div class="d-flex align-items-center justify-content-end">
                        <a href="#" class="btn btn-light btn-sm-square rounded-circle me-3"><i class="fab fa-facebook-f"></i></a>
                        <a href="#" class="btn btn-light btn-sm-square rounded-circle me-3"><i class="fab fa-twitter"></i></a>
                        <a href="#" class="btn btn-light btn-sm-square rounded-circle me-3"><i class="fab fa-instagram"></i></a>
                        <a href="#" class="btn btn-light btn-sm-square rounded-circle me-0"><i class="fab fa-linkedin-in"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Topbar End -->

    <!-- Navbar & Hero Start -->
    <div class="container-fluid nav-bar sticky-top px-0 px-lg-4 py-2 py-lg-0">
        <div class="container">
            <nav class="navbar navbar-expand-lg navbar-light">
                <a th:href="@{/}" class="navbar-brand p-0">
                    <h1 class="display-6 text-primary"><i class="fas fa-car-alt me-3"></i>MyCar</h1>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                    <span class="fa fa-bars"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarCollapse">
                    <div class="navbar-nav mx-auto py-0">
                        <a th:href="@{/}" class="nav-item nav-link" th:classappend="${requestURI == '/' ? 'active' : ''}">Inicio</a>
                        <a th:href="@{/about}" class="nav-item nav-link" th:classappend="${requestURI == '/about' ? 'active' : ''}">Nosotros</a>
                        <a th:href="@{/vehicle}" class="nav-item nav-link" th:classappend="${requestURI == '/vehicle' ? 'active' : ''}">Vehículos</a>
                    </div>
                    <div class="navbar-nav me-auto py-0">
                        <div sec:authorize="!isAuthenticated()">
                            <a th:href="@{/login}"
                               class="btn btn-danger rounded-pill py-2 px-4 ms-lg-4 d-inline-flex align-items-center">
                                Iniciar Sesión
                            </a>
                            <a th:href="@{/register}"
                               class="btn btn-danger rounded-pill py-2 px-4 ms-lg-2 d-inline-flex align-items-center">
                                Registrarse
                            </a>
                        </div>
                        <div sec:authorize="isAuthenticated()">
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="btn btn-danger rounded-pill py-2 px-4 ms-lg-4 d-inline-flex align-items-center">
                                    Salir
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </nav>
        </div>
    </div>
    <!-- Navbar & Hero End -->
</body>
</html>
