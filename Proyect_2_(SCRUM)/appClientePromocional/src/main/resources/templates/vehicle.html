<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="utf-8">
        <title>FioriRent's - Vehículos</title>
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <meta content="" name="keywords">
        <meta content="" name="description">

        <!-- Google Web Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"> 

        <!-- Icon Font Stylesheet -->
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

        <!-- Libraries Stylesheet -->
        <link href="lib/animate/animate.min.css" rel="stylesheet">
        <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">


        <!-- Customized Bootstrap Stylesheet -->
        <link href="css/bootstrap.min.css" rel="stylesheet">

        <!-- Template Stylesheet -->
        <link href="css/style.css" rel="stylesheet">
    </head>

    <body>

            <div th:replace="~{topbar :: body}"></div>
        
            <!-- Header Start -->
            <div class="container-fluid bg-breadcrumb mb-5">
                <div class="container text-center py-5" style="max-width: 900px;">
                    <h4 class="text-white display-4 mb-4 wow fadeInDown" data-wow-delay="0.1s">Nuestros Vehículos</h4>
                    <ol class="breadcrumb d-flex justify-content-center mb-0 wow fadeInDown" data-wow-delay="0.3s">
                        <li class="breadcrumb-item"><a th:href="@{/}">Inicio</a></li>
                        <li class="breadcrumb-item"><a href="#">Páginas</a></li>
                        <li class="breadcrumb-item active text-primary">Vehículos</li>
                    </ol>    
                </div>
            </div>
            <!-- Header End -->
        
            <!-- Car categories Start -->
            <div class="container-fluid categories py-5">
                <div class="container">
                    <div class="text-center mx-auto pb-5 wow fadeInUp" data-wow-delay="0.1s" style="max-width: 800px;">
                        <h1 class="display-5 text-capitalize mb-3">Nuestros <span class="text-primary">Vehículos</span></h1>
                        <p class="mb-0">Explora nuestra diversa selección de vehículos, desde compactos económicos hasta SUVs espaciosos y autos de lujo. Encuentra el coche perfecto para tu próxima aventura con FioriRent's.
                        </p>
                    </div>
                    <div class="row g-4">
                        <div class="col-md-6 wow fadeInUp" data-wow-delay="0.1s" th:each="vehiculo : ${vehiculos}">
                            <div class="categories-item p-3">
                                <div class="categories-item-inner">
                                    <div class="categories-img rounded-top">
                                        <img th:if="${vehiculo.caracteristicaVehiculo.imagenDto != null && vehiculo.caracteristicaVehiculo.imagenDto.contenido != null}" th:src="'data:image/png;base64,' + ${vehiculo.caracteristicaVehiculo.imagenDto.getContenidoAsBase64()}" class="img-fluid w-100 rounded-top" alt="">
                                        <img th:if="${vehiculo.caracteristicaVehiculo.imagenDto == null || vehiculo.caracteristicaVehiculo.imagenDto.contenido == null}" th:src="@{/img/car-1.png}" class="img-fluid w-100 rounded-top" alt="">
                                    </div>
                                    <div class="categories-content rounded-bottom p-3">
                                        <h4 th:text="${vehiculo.caracteristicaVehiculo.marca + ' ' + vehiculo.caracteristicaVehiculo.modelo}"></h4>
                                    <div class="mb-3">
                                            <h4 class="bg-white text-primary rounded-pill py-2 px-3 mb-0" th:text="${'$' + vehiculo.costoVehiculo.costo + '/Dia'}"></h4>
                                        </div>
                                        <div class="row gy-2 gx-0 text-center mb-3">
                                            <div class="col-6">
                                                <i class="fa fa-users text-dark"></i> <span class="text-body ms-1" th:text="${vehiculo.caracteristicaVehiculo.cantidadAsientos + ' Asientos'}"></span>
                                            </div>
                                            <div class="col-6">
                                                <i class="fa fa-car text-dark"></i> <span class="text-body ms-1" th:text="${vehiculo.caracteristicaVehiculo.cantidadPuertas + ' Puertas'}"></span>
                                            </div>
                                            <div class="col-6">
                                                <i class="fa fa-car text-dark"></i> <span class="text-body ms-1" th:text="${vehiculo.caracteristicaVehiculo.anio}"></span>
                                            </div>
                                            <div class="col-6 mt-2">
                                                <i class="fa fa-car text-dark"></i> <span class = "text-body ms-1" th:text="${'Disponibles: ' + (vehiculo.caracteristicaVehiculo.cantidadTotalVehiculos - vehiculo.caracteristicaVehiculo.cantidadTotalVehiculosAlquilados)}"></span>
                                            </div>
                                        </div>
                                        <a th:href="@{/book(vehiculoId=${vehiculo.id})}" class="btn btn-primary rounded-pill d-flex justify-content-center py-2">Reservar Ahora</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Car categories End -->
        
            <div th:replace="~{bottombar :: body}"></div>
        
            <!-- JavaScript Libraries -->
            <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
            <script th:src="@{/lib/wow/wow.min.js}"></script>
            <script th:src="@{/lib/easing/easing.min.js}"></script>
            <script th:src="@{/lib/waypoints/waypoints.min.js}"></script>
            <script th:src="@{/lib/owlcarousel/owl.carousel.min.js}"></script>
            
        
            <!-- Template Javascript -->
            <script th:src="@{/js/main.js}"></script>
            </body>
        
        </html>
